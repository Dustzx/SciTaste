<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">The Scientific Taste loop</title>
  <desc id="desc">High-quality research is abstracted into scientific taste. Scientific taste selects a next action, the action produces an outcome, and that outcome updates future judgment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65d2e"/>
    </marker>
    <style>
      .label { font: 600 28px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #282722; }
      .core { font: 650 32px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fffaf3; }
      .detail { font: 400 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #625f56; }
      .core-detail { font: 400 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f5e9da; }
      .verb { font: 650 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.6px; fill: #a65d2e; }
      .arrow { fill: none; stroke: #a65d2e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="720" height="540" rx="28" fill="#fbfaf7"/>

  <rect x="90" y="34" width="540" height="104" rx="20" fill="#fffaf3" stroke="#d8cabb" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" class="label">High-quality research</text>
  <text x="360" y="112" text-anchor="middle" class="detail">papers · reviews · revisions · outcomes</text>

  <path d="M360 138 V190" class="arrow"/>
  <text x="382" y="171" class="verb">ABSTRACT</text>

  <rect x="90" y="202" width="540" height="120" rx="24" fill="#3d3a34"/>
  <circle cx="144" cy="262" r="24" fill="none" stroke="#d99762" stroke-width="3"/>
  <path d="M144 246 V278 M128 262 H160" stroke="#d99762" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="252" text-anchor="middle" class="core">Scientific Taste</text>
  <text x="360" y="287" text-anchor="middle" class="core-detail">precedent · evidence · uncertainty · budget</text>

  <path d="M285 322 C245 348 226 360 211 386" class="arrow"/>
  <text x="203" y="355" text-anchor="end" class="verb">DECIDE</text>

  <rect x="44" y="398" width="282" height="104" rx="20" fill="#f3ede4" stroke="#d8cabb" stroke-width="2"/>
  <text x="185" y="442" text-anchor="middle" class="label">Next action</text>
  <text x="185" y="476" text-anchor="middle" class="detail">test · revise · pivot · stop</text>

  <path d="M326 450 H388" class="arrow"/>
  <text x="357" y="430" text-anchor="middle" class="verb">OBSERVE</text>

  <rect x="400" y="398" width="276" height="104" rx="20" fill="#eef0e9" stroke="#bfc5b5" stroke-width="2"/>
  <text x="538" y="442" text-anchor="middle" class="label">Outcome</text>
  <text x="538" y="476" text-anchor="middle" class="detail">evidence · failure · cost</text>

  <path d="M615 398 C682 358 688 300 634 266" class="arrow" stroke-dasharray="8 9"/>
  <text x="674" y="334" text-anchor="middle" class="verb" transform="rotate(-90 674 334)">UPDATE JUDGMENT</text>
</svg>
