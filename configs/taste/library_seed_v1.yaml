  - case_id: taste-positive-scope
    stage: COMMUNICATION
    context_summary: A contribution statement begins by listing what the paper does not establish.
    problem_pattern: Repeated defensive qualification hides the supported positive scope.
    evidence_state: The claim boundary is known and can be stated directly.
    candidate_actions: [STATE_POSITIVE_SCOPE, LEAD_WITH_DISCLAIMER]
    preferred_action: STATE_POSITIVE_SCOPE
    rejected_actions: [LEAD_WITH_DISCLAIMER]
    decision_principle: State the supported scope first and place a necessary qualification where it changes interpretation.
    why_preferred: Positive scope improves clarity while retaining scientifically material limitations.
    outcome_summary: The claim becomes direct, bounded, and less vulnerable to accidental self-expansion.
    confidence: 0.9
    retrieval_eligible: true
    human_verified: true
    label_basis: project_curated_external_method
