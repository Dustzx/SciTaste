  - case_id: taste-material-limitation-integrity
    stage: COMMUNICATION
    context_summary: Stronger framing is proposed for a paper whose central comparison has an unresolved validity limitation.
    problem_pattern: Persuasive editing risks hiding information required to interpret the claim.
    evidence_state: A material uncertainty or counterresult remains registered.
    candidate_actions: [PRESERVE_AND_PLACE_LIMITATION, HIDE_LIMITATION]
    preferred_action: PRESERVE_AND_PLACE_LIMITATION
    rejected_actions: [HIDE_LIMITATION]
    decision_principle: Scientific integrity outranks rhetorical advantage; preserve every limitation that changes validity, scope, safety, or reproducibility.
    why_preferred: Writing Taste strengthens supported claims but never converts selective reporting into persuasion.
    outcome_summary: The limitation is stated once, precisely, and in the section where readers interpret the affected claim.
    confidence: 1.0
    retrieval_eligible: true
    human_verified: true
    label_basis: project_policy
    domain_tags: [scientific-writing]
    venue_tags: [general-ml]
    writing_level: paper
    rhetorical_role: calibrate limitation
    claim_strength: bounded
    writing_taste_dimensions: [scientific_integrity, precision_and_scope, claim_calibration]
    style_tags: [mandatory-disclosure, non-selective]
    provenance:
