  - case_id: taste-abstract-contribution-opening
    stage: COMMUNICATION
    context_summary: An abstract opens with implementation status and qualifications before explaining the research problem and contribution.
    problem_pattern: The highest-attention section delays its scientific message.
    evidence_state: The problem, approach, and strongest supported result are all available.
    candidate_actions: [OPEN_WITH_PROBLEM_CONTRIBUTION_RESULT, OPEN_WITH_PROJECT_STATUS]
    preferred_action: OPEN_WITH_PROBLEM_CONTRIBUTION_RESULT
    rejected_actions: [OPEN_WITH_PROJECT_STATUS]
    decision_principle: Establish the problem, gap, contribution, strongest evidence, and meaning before secondary qualifications.
    why_preferred: The abstract should make the paper's value legible without overstating evidence.
    outcome_summary: Readers can recover the scientific argument from the opening sentences.
    confidence: 0.9
    retrieval_eligible: true
    human_verified: true
