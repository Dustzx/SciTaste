  - case_id: taste-figure-mechanism
    stage: COMMUNICATION
    context_summary: A method figure should explain which evidence enters the controller and which selected action reaches the executor.
    candidate_actions: [DESIGN_FIGURE, WRITE]
    preferred_action: DESIGN_FIGURE
    rejected_actions: [WRITE]
    decision_principle: Visualize the scientific relation that is difficult to recover from prose alone.
    why_preferred: The control boundary and feedback loop are the intended reader takeaway.
    outcome_summary: The figure contract emphasizes controller ownership and executor isolation.
    confidence: 0.85
