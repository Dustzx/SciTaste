  - case_id: taste-results-argument-not-log
    stage: COMMUNICATION
    context_summary: A Results section is organized around repository revisions, attempts, tests, and implementation chronology.
    problem_pattern: Project-log structure replaces scientific argument.
    evidence_state: Valid results exist, but their argumentative duties are not explicit.
    candidate_actions: [ORGANIZE_BY_RESEARCH_QUESTION, KEEP_PROCESS_CHRONOLOGY]
    preferred_action: ORGANIZE_BY_RESEARCH_QUESTION
    rejected_actions: [KEEP_PROCESS_CHRONOLOGY]
    decision_principle: Organize results by the question answered, mechanism tested, or alternative explanation ruled out.
    why_preferred: Readers should see what each result establishes rather than reconstructing meaning from development history.
    outcome_summary: Engineering provenance remains in the artifact record while the paper presents standing scientific logic.
    confidence: 0.95
    retrieval_eligible: true
    human_verified: true
    label_basis: project_curated_external_method
