  - case_id: taste-paper-evidence-centered-story
    stage: COMMUNICATION
    context_summary: A research paper contains many implementation events, but only a subset supports its central scientific contribution.
    problem_pattern: Equal-weight reporting obscures the strongest supported contribution.
    evidence_state: Claims and evidence are registered, but narrative priority is unresolved.
    candidate_actions: [CENTER_STRONGEST_EVIDENCE, REPORT_ALL_EQUALLY]
    preferred_action: CENTER_STRONGEST_EVIDENCE
    rejected_actions: [REPORT_ALL_EQUALLY]
    decision_principle: Build the paper around the most important contribution that the registered evidence actually supports.
    why_preferred: Scientific persuasion requires explicit priority without expanding claims or suppressing material counterevidence.
    outcome_summary: The main narrative becomes selective by relevance while the complete evidence record remains auditable.
    confidence: 0.9
    retrieval_eligible: true
    human_verified: true
    label_basis: project_curated_external_method
    domain_tags: [scientific-writing]
    venue_tags: [general-ml]
    writing_level: paper
    rhetorical_role: select narrative center
    claim_strength: calibrated
    writing_taste_dimensions: [scientific_integrity, narrative_focus, evidence_prioritization]
    style_tags: [claim-forward, evidence-bounded]
