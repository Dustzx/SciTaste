taste_cases:
  - case_id: taste-probe-before-commitment
    stage: DISCOVERY
    context_summary: Problem evidence is weak, behavior is unclear, and a low-cost controlled probe can resolve competing explanations.
    problem_pattern: Premature commitment under high uncertainty.
    evidence_state: Only a speculative working hypothesis is available.
    candidate_actions: [PROBE, IDEATE]
    preferred_action: PROBE
    rejected_actions: [IDEATE]
    decision_principle: Prefer the cheapest action that materially reduces decision-relevant uncertainty.
    why_preferred: A probe establishes whether a mature problem exists before implementation cost is incurred.
    outcome_summary: A stable contradiction exposed a more useful failure boundary.
    confidence: 0.9
    retrieval_eligible: true
    domain_tags: [autonomous-research]
    venue_tags: []
    provenance:
      - source_type: project_specification
        locator: SciTaste_Full_Project_Codex_Spec_v1.1.md#12.4
        version: v1.1

  - case_id: taste-review-add-baseline
    stage: REVIEW
    context_summary: A reviewer identifies a missing baseline that could change the central empirical conclusion.
    reviewer_context: The comparison is required to establish that gains do not come from extra compute.
    candidate_actions: [RESPOND, ADD_BASELINE, NARROW_CLAIM]
    preferred_action: ADD_BASELINE
    rejected_actions: [RESPOND]
    decision_principle: Route evidence-bearing reviewer concerns back into the Evidence Loop.
    why_preferred: Rewriting cannot close an obligation whose truth depends on a new controlled result.
    outcome_summary: The matched baseline determines whether the claim survives or must be narrowed.
    confidence: 0.95
    retrieval_eligible: true
    domain_tags: [autonomous-research]
    venue_tags: [general-ml]
    provenance:
      - source_type: project_specification
        locator: SciTaste_Full_Project_Codex_Spec_v1.1.md#21.4
        version: v1.1

  - case_id: taste-introduction-limitation
    stage: COMMUNICATION
    context_summary: The introduction must transition from prior progress to a specific unresolved failure.
    candidate_actions: [WRITE, NARROW_CLAIM]
    preferred_action: WRITE
    rejected_actions: []
    decision_principle: Use the paragraph to expose the evidence-backed limitation, not to repeat background.
    why_preferred: The rhetorical move makes the research need legible before presenting the method.
    outcome_summary: The narrative spine remains aligned with the supported problem.
    confidence: 0.8
    retrieval_eligible: true
    domain_tags: [scientific-writing]
    venue_tags: [general-ml]
