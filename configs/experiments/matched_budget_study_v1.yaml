expert_panel:
  rubric_version: scitaste-system-rubric-v1
  min_reviewers_per_cell: 2
  condition_blinded: true
  adjudication_required_on_conflict: true
  dimensions:
    - problem_quality
    - idea_quality
    - evidence_quality
    - story_quality
    - writing_quality
    - figure_quality
    - final_preference_score
preregistered_outcomes:
  - research_yield_per_gpu_hour
  - idea_yield
  - invalid_idea_rate
  - unproductive_experiment_rate
  - gpu_hours_before_useful_signal
  - evidence_sufficiency
  - reviewer_concern_closure_rate
  - unsupported_claim_rate
  - correct_pivot_rate
  - final_expert_preference
