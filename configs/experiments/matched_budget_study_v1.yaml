conditions:
  - condition: autoresearchclaw
    enabled: true
    implementation_ref: autoresearchclaw@12d3fd809fa9658e91a0328c3280a0e462c78386
  - condition: knowledge_rag
    enabled: true
    implementation_ref: scitaste@4eb735dc7b3497a91fab414e2d73bb5f0396f854:knowledge-rag
  - condition: taste_library
    enabled: true
    implementation_ref: scitaste@4eb735dc7b3497a91fab414e2d73bb5f0396f854:taste-library
  - condition: full_scitaste
    enabled: true
    implementation_ref: scitaste@4eb735dc7b3497a91fab414e2d73bb5f0396f854:full
