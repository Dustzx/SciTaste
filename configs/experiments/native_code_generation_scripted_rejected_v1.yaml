schema_version: "1.0"
generation_id: conflict-pivot-codegen-v1
proposal_id: conflict-pivot-model-proposal-v1
trigger_reason: >-
  Produce the registered executable measurement proposal; this fixture deliberately
  exercises deterministic rejection before the bounded repair node.
objective: >-
  Implement a deterministic three-replicate comparison and emit the three registered
  metrics using the SciTaste measurement envelope.
constraints:
  - Use only imports allowed by admission_policy.
  - Emit exactly one SCITASTE_MEASUREMENTS_JSON line.
expected_metrics:
  - baseline_correct_pivot_rate
  - conflict_aware_correct_pivot_rate
  - correct_pivot_delta
experiment:
  experiment_id: experiment-support
  primary_metric: correct_pivot_delta
  metric_direction: maximize
  support_threshold: 0.0
  limits:
    timeout_seconds: 15.0
    cpu_seconds: 10
    max_memory_mb: 256
    max_output_bytes: 65536
    max_open_files: 32
    max_processes: 16
admission_policy:
  schema_version: "1.0"
  policy_id: scitaste-native-python-v1
  max_source_bytes: 65536
  max_ast_nodes: 5000
  max_literal_bytes: 32768
  allowed_imports:
    - collections
    - decimal
    - fractions
    - functools
    - hashlib
    - itertools
    - json
    - math
    - random
    - re
    - statistics
    - string
profile_set: native_code_generation_profiles_scripted_v1.yaml
profile_id: scitaste-native-code-scripted
policy:
  policy_id: scitaste-native-code-scripted-v1
  enabled: true
  allowed_node_names:
    - native-code-proposal
  expected_backend: scitaste-scripted
  expected_model: bounded-python-generator-v1
  allowed_tool_names: []
  allowed_action_types: []
  max_request_bytes: 160000
  max_input_tokens: 12000
  max_output_tokens: 8192
  max_total_tokens: 20192
  max_api_cost_usd: 1.0
  max_latency_ms: 180000
  require_cost_telemetry: true
  ambiguity_margin_max: 0.0
backend:
  kind: scripted
  provider: scitaste-scripted
  model: bounded-python-generator-v1
  reply:
    output_payload:
      schema_version: "1.0"
      source_code: |
        import os

        baseline_correct_pivot_rate = "baseline_correct_pivot_rate"
        conflict_aware_correct_pivot_rate = "conflict_aware_correct_pivot_rate"
        correct_pivot_delta = "correct_pivot_delta"
        print("SCITASTE_MEASUREMENTS_JSON={}")
      rationale: >-
        This deliberately malformed fixture proves that deterministic admission invokes
        the bounded repair path rather than executing rejected source.
      assumptions:
        - The repair fixture is used only for engineering acceptance.
    usage:
      input_tokens: 300
      output_tokens: 200
      cost_usd: 0.0
    latency_ms: 5.0
    tool_calls: []
live_enabled: false
proposal_only: true
deterministic_admission_required: true
runtime_isolation_required: true
effectiveness_claim: false
