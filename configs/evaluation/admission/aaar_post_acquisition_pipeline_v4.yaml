schema_version: "2.0"
pipeline_id: aaar-post-acquisition-pipeline-v4
project_id: scitaste-self-development
status: local-calibration-planned-runtime-and-human-evidence-pending
supersedes: aaar-post-acquisition-pipeline-v3
scientific_question: >-
  Can a prestige-blind, content-grounded source screen identify complete
  contrastive decision episodes before Scientific Taste abstraction?
stages:
  - id: receipt-and-content-integrity
    kind: deterministic
    reads_source_body: true
    standing_local_read_policy:
      path: configs/evaluation/acquisition/standing_owner_local_read_policy_v1.yaml
    requires_separate_owner_approval: false
    output: bounded-content-audit-report
  - id: rights-and-isolation-prescreen
    kind: deterministic-plus-curator
    reads_source_body: false
    requirements:
      - research-analysis-and-derived-abstraction-rights
      - attribution-preserved
      - held-out-and-self-development-source-groups-excluded
    output: rights-and-isolation-evidence
  - id: prestige-blind-quality-projection
    kind: deterministic
    reads_source_body: true
    implementation: scitaste.evaluation.aaar_quality_projection
    standing_local_read_policy:
      path: configs/evaluation/acquisition/standing_owner_local_read_policy_v1.yaml
    requires_separate_owner_approval: false
    exclusions: [author, venue, citation_count, relation_label, downstream_task_identity]
    outcome_policy: explicitly-available-or-withheld
    output: canonical-hashed-quality-projection
  - id: local-instrument-calibration
    kind: proposal-only-local-model-node
    reads_source_body: false
    implementation: scitaste.evaluation.aaar_quality_calibration
    evidence: docs/research/data/aaar_reference_quality_local_calibration_v2.yaml
    candidate_profiles: configs/model_nodes/runtime_profiles.reference_quality_v3.yaml
    cohort_policy:
      - maximum-context-stress
      - maximum-redaction-stress
    output: project-ledger-bound-local-calibration-proposals
    status: planned-awaiting-owner-resource-review
  - id: reference-quality-proposal
    kind: proposal-only-model-node
    node_name: reference-quality
    dimensions:
      - evidential_rigor
      - decision_traceability
      - alternative_visibility
      - failure_boundary_visibility
      - transfer_potential
    admission_rule: all-five-strong-with-exact-source-support
    candidate_profiles: configs/model_nodes/runtime_profiles.reference_quality_v3.yaml
    output: project-ledger-bound-untrusted-proposal
  - id: content-free-quality-qualification
    kind: deterministic
    command: scitaste evaluation reference-quality-qualification
    output: content-free-reference-quality-receipt
    authorizes_source_admission: false
  - id: independent-quality-review
    kind: dual-independent-human
    reviewers_per_source: 2
    reviewer_blinding: [prestige-signals, model-assessment, other-review, downstream-outcome]
    split_vote_rule: reject-until-independent-adjudication
    output: anchored-five-dimension-reviews
  - id: final-source-admission
    kind: deterministic
    schema_version: "1.1"
    implementation: scitaste.evaluation.source_admission
    requirements:
      - complete-audited-population-retained
      - reference-quality-receipt-bound
      - two-admitting-anchored-reviews
      - rights-and-isolation-pass
    output: admitted-and-rejected-source-ledger
  - id: grounded-taste-abstraction
    kind: proposal-only-model-plus-dual-human
    implementation: scitaste.taste.semantic.GroundedTasteAbstractionNode
    candidate_profiles: configs/model_nodes/runtime_profiles.grounded_taste_abstraction_v2.yaml
    output: grounded-transfer-bounded-taste-candidate
authority:
  authorizes_download: false
  authorizes_content_access: true
  authorizes_model_calls: false
  authorizes_human_recruitment: false
  authorizes_source_admission: false
  authorizes_experiment: false
claim_boundary: >-
  This pipeline verifies the transition from acquired bytes to model-ready
  prestige-blind quality projections and now binds an exact two-source local
  calibration plan. Tokenization was performed locally, but no model was loaded,
  no provider was called, no GPU generation or human judgment occurred, and no
  source admission, Taste abstraction, or effectiveness result exists.
