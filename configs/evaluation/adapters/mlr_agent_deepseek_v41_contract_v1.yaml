schema_version: "1.0"
contract_id: mlr-agent-deepseek-v41-contract-v1
authorization_scope: static-translation-only
external_resource_id: mlr-agent
expected_upstream_commit: f728d571a992d71c8b526eeb4d9ab6bb5c8cc824
invocation:
  upstream_entrypoint: run_mlr_agent.py
  argv_template:
    - "{python}"
    - "{upstream_root}/run_mlr_agent.py"
    - --model_name
    - "{model_id}"
    - --lit_engine_name
    - "{model_id}"
    - --coding_agent
    - "{coding_agent}"
  environment_allowlist:
    - OPENROUTER_API_KEY
  shell: false
task_translation:
  selected_task_form: task-directory
  upstream_input_name: task.md under one derived end2end task directory
  one_task_per_process: false
  preserves_exact_starting_bytes: true
  runtime_acquisition_policy_injectable: false
model_translation:
  provider_id: deepseek
  requested_model_id: deepseek-flash
  requested_model_revision: DeepSeek-V4.1-Flash
  upstream_model_id: deepseek/deepseek-chat-v3-0324
  all_model_roles_matched: false
  unmatched_roles:
    - literature-search model
    - coding agent
    - experiment model
requirements:
  task_mapping:
    status: blocked
    summary: Published CLI derives task roots from model/coding-agent names and has no DeepSeek branch.
    official_source_urls:
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/run_mlr_agent.py
    evidence_ref: docs/research/protocols/EXTERNAL_ADAPTER_COMPATIBILITY_AUDIT_V1.md
    evidence_sha256: eedc50527f067d1fa1d2b26eb47df044e79b1bde8cab85036e54b5356f96c0f2
  model_mapping:
    status: blocked
    summary: Registry supports a distinct OpenRouter DeepSeek V3 model and unmatched coding agents, not DeepSeek V4.1 Flash for every role.
    official_source_urls:
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/llm/llm.py
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/agent/experiment_runner.py
    evidence_ref: docs/research/protocols/EXTERNAL_ADAPTER_COMPATIBILITY_AUDIT_V1.md
    evidence_sha256: eedc50527f067d1fa1d2b26eb47df044e79b1bde8cab85036e54b5356f96c0f2
  sandbox:
    status: blocked
    summary: Dynamic downloads and generated-code execution have not passed the matched isolation policy.
    official_source_urls:
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/agent/experiment_runner.py
    evidence_ref: docs/research/protocols/EXTERNAL_ADAPTER_COMPATIBILITY_AUDIT_V1.md
    evidence_sha256: eedc50527f067d1fa1d2b26eb47df044e79b1bde8cab85036e54b5356f96c0f2
  telemetry:
    status: blocked
    summary: End-to-end calls, coding work, retries, cost, experiments, and interventions are not completely aggregated.
    official_source_urls:
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/mlrbench/llm/llm.py
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/run_mlr_agent.py
    evidence_ref: docs/research/protocols/EXTERNAL_ADAPTER_COMPATIBILITY_AUDIT_V1.md
    evidence_sha256: eedc50527f067d1fa1d2b26eb47df044e79b1bde8cab85036e54b5356f96c0f2
  artifact_mapping:
    status: pending
    summary: Native Markdown and stage files need a complete failure-inclusive immutable inventory.
    official_source_urls:
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/README.md
    evidence_ref: docs/research/protocols/EXTERNAL_ADAPTER_COMPATIBILITY_AUDIT_V1.md
    evidence_sha256: eedc50527f067d1fa1d2b26eb47df044e79b1bde8cab85036e54b5356f96c0f2
  failure_resume:
    status: pending
    summary: No exact-cell content-addressed retry and resume boundary has been demonstrated.
    official_source_urls:
      - https://raw.githubusercontent.com/chchenhui/mlrbench/f728d571a992d71c8b526eeb4d9ab6bb5c8cc824/run_mlr_agent.py
    evidence_ref: docs/research/protocols/EXTERNAL_ADAPTER_COMPATIBILITY_AUDIT_V1.md
    evidence_sha256: eedc50527f067d1fa1d2b26eb47df044e79b1bde8cab85036e54b5356f96c0f2
forbidden_changes:
  - Do not rename a DeepSeek V3 or OpenRouter model as DeepSeek V4.1 Flash.
  - Do not replace the native coding subsystem while calling the condition unchanged-core.
  - Do not bypass the hard-coded task mapping without a separately audited adapter bootstrap.
requires_separate_upstream_preflight: true
no_external_download: true
no_execution_performed: true
