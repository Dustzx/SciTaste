schema_version: "1.0"
protocol_id: iclr2027-api-identity-v1
project_id: scitaste-self-development
sentinel:
  purpose: identity_only_no_task_data
  system_message: >-
    You are executing an API identity sentinel. Do not use tools or external
    information. Return only the requested JSON object.
  user_message: >-
    Return exactly {"sentinel":"scitaste-api-identity-v1"}.
  response_format: json_object
  max_output_tokens: 64
  task_or_benchmark_content_allowed: false
candidate_policies:
  - resource_id: deepseek-v4-flash
    identity_mode: official_revision_plus_temporal_window
    official_revision: DeepSeek-V4-Flash-0731
    maximum_formal_window_hours: 24
    returned_identity_policy: declared_allowlist
    allowed_returned_model_ids:
      - deepseek-v4-flash
      - DeepSeek-V4-Flash-0731
    official_catalog_rechecked_at_window_open: true
    official_catalog_rechecked_at_window_close: true
    start_sentinel_required: true
    end_sentinel_required: true
    sentinel_after_maximum_calls: 50
    pilot_and_formal_windows_are_distinct: true
  - resource_id: zhipu-glm53-flash
    identity_mode: temporal_window_only
    official_revision: null
    maximum_formal_window_hours: 12
    returned_identity_policy: declared_allowlist
    allowed_returned_model_ids:
      - glm-5.3-flash
    official_catalog_rechecked_at_window_open: true
    official_catalog_rechecked_at_window_close: true
    start_sentinel_required: true
    end_sentinel_required: true
    sentinel_after_maximum_calls: 25
    pilot_and_formal_windows_are_distinct: true
capture_fields:
  - provider_id
  - endpoint
  - interface
  - requested_model_id
  - returned_model
  - official_revision
  - provider_request_id
  - request_started_at_utc
  - response_completed_at_utc
  - request_sha256
  - response_sha256
  - http_status
  - input_tokens
  - output_tokens
retain_raw_request: true
retain_raw_response: true
missing_identity_action: abort_window
drift_action: close_window_and_open_new_stratum
cross_window_pooling: false
cross_revision_pooling: false
cross_provider_pooling: false
candidate_selected_before_formal_outcomes: true
conformance_data_excluded_from_formal_tests: true
authorizes_api_calls: false
authorizes_execution: false
