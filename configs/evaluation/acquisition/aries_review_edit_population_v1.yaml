purpose: >-
  Download the minimum official ARIES objects needed to construct source-grouped
  natural review-to-edit decision candidates without downloading provider caches,
  generated edits, synthetic training labels, or the full author-reply corpus.
claim_boundary: >-
  This transaction establishes only publisher-object identity and local bytes.
  Observed edits and alignment labels are not preferred scientific actions;
  benchmark admission still requires privacy filtering, source-group separation,
  two independent scientific-value reviews, and a frozen formal split.
