lifecycle_state_machine:
  initial_state: task-acquisition-proposed
  states:
    - state_id: task-acquisition-proposed
      required_artifacts: [resource-pin, license-scope, task-purpose, no-action-approval-request]
      next: acquired-quarantined
    - state_id: acquired-quarantined
      required_artifacts: [byte-hashes, provenance, asset-inventory, quarantine-receipt]
      next: task-admitted-and-split-frozen
    - state_id: task-admitted-and-split-frozen
      required_artifacts: [source-groups, pilot-formal-split, hidden-scorer-firewall, exclusion-ledger]
      next: models-and-systems-frozen
    - state_id: models-and-systems-frozen
      required_artifacts: [task-excluded-model-selection, exact-model-identities, adapter-attestations, budgets]
      next: idea-candidates-generated
    - state_id: idea-candidates-generated
      required_artifacts: [task-state, closed-candidate-set, candidate-provenance]
      next: idea-decision-locked
    - state_id: idea-decision-locked
      required_artifacts: [selected-idea, selection-rationale, rejected-alternatives, pre-execution-timestamp]
      next: experiment-plan-frozen
    - state_id: experiment-plan-frozen
      required_artifacts: [hypotheses, metrics, development-plan, hidden-evaluation-plan, stop-policy]
      next: development-execution
    - state_id: development-execution
      required_artifacts: [immutable-command-log, API-ledger, compute-ledger, failures-and-retries]
      next: candidate-frozen
    - state_id: candidate-frozen
      required_artifacts: [code-hash, environment-lock, checkpoint-hashes, no-more-development-attestation]
      next: hidden-scoring
    - state_id: hidden-scoring
      required_artifacts: [isolated-inference-receipt, scorer-version, score-output, firewall-report]
      next: evidence-admission
    - state_id: evidence-admission
      required_artifacts: [claim-result-links, validity-findings, failure-retention, contradiction-ledger]
      next: paper-assembly
    - state_id: paper-assembly
      required_artifacts: [evidence-linked-draft, limitation-disclosures, resource-accounting]
      next: dual-ai-review
    - state_id: dual-ai-review
      required_artifacts: [two-distinct-reviewer-identities, two-raw-reviews, disagreement-map]
      conditional_next:
        agreement: review-driven-revision
        disagreement: ai-adjudication
    - state_id: ai-adjudication
      required_artifacts: [distinct-adjudicator-identity, adjudication-response, resolution-map]
      next: review-driven-revision
    - state_id: review-driven-revision
      required_artifacts: [review-action-ledger, revised-draft, unchanged-evidence-attestation]
      next: final-ai-review-and-package-freeze
    - state_id: final-ai-review-and-package-freeze
      required_artifacts: [final-dual-ai-disposition, unresolved-objections, immutable-package-manifest]
      next: complete
    - state_id: complete
      required_artifacts: [trajectory-manifest, endpoint-summary, cost-summary]
  revision_routes:
    final-review-requires-new-experiment: experiment-plan-frozen
    final-review-requires-reexecution: development-execution
    final-review-requires-reanalysis: evidence-admission
    final-review-requires-rewrite: paper-assembly
  fail_closed_transitions:
    - hidden-data-visible-before-candidate-freeze
    - missing-failed-run-or-retry
    - unlogged-formal-manual-repair
    - paper-claim-without-admitted-evidence
    - final-package-without-review-driven-revision

execution_blocks:
  - block_id: adaptive-policy-activation
    formal_evidence: false
    purpose: learn-a-source-disjoint-adaptive-allocation-head-and-prove-the-treatment-is-active
    required_coverage: [nine-frozen-NewtonBench-tasks, cross-model-AI-review, target-domain-state-probe]
    scale_out_allowed: false
  - block_id: development-treatment-pair
    formal_evidence: false
    purpose: execute-one-real-two-arm-development-trajectory-with-an-active-treatment
    start_gate: adaptive-policy-active-feedback-sensitive-and-resource-authority-recorded
    required_coverage: [E2-two-arm-development-loop, failure-retention, candidate-freeze-shape]
    scale_out_allowed: false
  - block_id: minimal-complete-formal-block
    formal_evidence: true
    start_gate: development-treatment-pair-complete-role-bindings-frozen-and-exact-resource-manifest-recorded
    required_coverage: [E1-primary-contrasts, E2-title-critical-pair, E3-one-complete-admitted-system-route, E4-diagnostic-pair, review-driven-revision]
    size_rule: smallest-source-disjoint-design-that-identifies-the-preregistered-contrasts
    scale_out_allowed: false
  - block_id: powered-source-disjoint-expansion
    formal_evidence: true
    start_gate: minimal-formal-block-valid-and-clustered-power-frozen
    size_rule: expand-only-contrasts-that-need-power-or-robustness
    forbidden_design: arbitrary-model-by-system-by-task-by-seed-grid

budget_policy:
  freeze_before_each_block: true
  matched_axes: [wall-time, api-tokens-and-cost, active-gpu-time, cpu-ram-disk, tools-network, repair-retries]
  intention_to_run: true
  formal_human_rescue_budget: zero
  budget_overrun_outcome: retained-failure

current_readiness:
  design_complete: true
  controller_compatible: implemented-awaiting-project-initialization
  one_shot_role_binding: core-execution-roles-complete-dual-review-panel-pending
  adaptive_policy_active: false
  development_treatment_pair_complete: false
  minimal_formal_block_complete: false
  title_effectiveness_authority: false

authorization:
  owner_allows_new_downloads_up_to_10GiB_each: true
  this_file_launches_downloads: false
  this_file_launches_api_calls: false
  this_file_launches_gpu_work: false
  exact-run-manifest-required_before_execution: true
