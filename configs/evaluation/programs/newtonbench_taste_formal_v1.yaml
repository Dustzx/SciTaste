schema_version: "1.0"
program_id: newtonbench-taste-formal-v1
project_id: scitaste-self-development
status: frozen-before-any-formal-task-execution
frozen_at: 2026-09-17T15:40:00+08:00

scientific_question: >-
  Under the same research model, hidden environment, tool budget, and scorer,
  does the frozen outcome-updated Scientific Taste policy improve autonomous
  scientific-law discovery over the identical Native controller with the
  learned policy weight set to zero?

estimand:
  unit: one-NewtonBench-physics-domain
  population: all-twelve-public-NewtonBench-physics-modules
  treatment: full-scitaste-learned-policy
  control: native-base-without-learned-taste
  primary_endpoint: symbolic_accuracy
  metric_direction: higher
  secondary_endpoints: [rmsle, experiments, model-tokens, api-cost, selected-action-trajectory]
  primary_contrast: paired-native-minus-base-across-task-domains
  failure_policy: retain-failed-or-over-budget-arms-at-symbolic-accuracy-zero

task_freeze:
  selection_rule: exactly-one-new-unobserved-seed-from-each-of-the-twelve-benchmark-modules
  seed_rule: consecutive-9400-through-9411-assigned-in-module-order-before-execution
  prior_result_observation: false
  tasks:
    - configs/evaluation/newtonbench/formal_task_gravity_v1.json
    - configs/evaluation/newtonbench/formal_task_coulomb_v1.json
    - configs/evaluation/newtonbench/formal_task_magnetic_v1.json
    - configs/evaluation/newtonbench/formal_task_fourier_v1.json
    - configs/evaluation/newtonbench/formal_task_snell_v1.json
    - configs/evaluation/newtonbench/formal_task_radioactive_v1.json
    - configs/evaluation/newtonbench/formal_task_underdamped_v1.json
    - configs/evaluation/newtonbench/formal_task_malus_v1.json
    - configs/evaluation/newtonbench/formal_task_sound_v1.json
    - configs/evaluation/newtonbench/formal_task_hooke_v1.json
    - configs/evaluation/newtonbench/formal_task_be_distribution_v1.json
    - configs/evaluation/newtonbench/formal_task_heat_v1.json

frozen_system:
  taste_policy: outputs/projects/scitaste-self-development/taste/policy/refreshes/scitaste-self-development-policy-v12-refresh/POLICY.json
  taste_policy_sha256: 3fd5a3c640ca7a0fdd4cecd36665119a4adfa9d30dce673611e05f6b1a8cac73
  decision_family: adaptive-allocation
  research_agent:
    provider: deepseek
    model: deepseek-flash
    config: configs/model_nodes/deepseek_v41flash.interactive_live_20260917.yaml
  symbolic_judge:
    provider: zhipu-direct
    model: glm-5.3-flash
    config: configs/model_nodes/zhipu_glm53_flash.newtonbench_development_v5.yaml
    generator_disjoint: true
  benchmark:
    repository: https://github.com/HKUST-KnowComp/NewtonBench.git
    commit: 912a4ba5f4356ddd06acc16e44460ca30be4abc2
  exact_same_backbone_between_treatment_and_control: true
  exact_same_agent_seed_within_each_pair: true
  exact_same_hidden_environment_within_each_pair: true

resource_ceiling:
  paired_trajectories: 12
  total_arms: 24
  turns_per_arm: 8
  experiments_per_arm: 24
  provider_retries: 0
  maximum_total_tokens_per_arm: 120000
  maximum_api_cost_usd_per_arm: 1
  gpu_hours: 0

analysis:
  report_all_tasks_and_failures: true
  primary_summary: paired-mean-risk-difference
  uncertainty: task-paired-exact-randomization-and-bootstrap-interval
  descriptive_breakdowns: [difficulty, system, behavioral-activation]
  multiplicity: one-confirmatory-primary-endpoint-secondary-endpoints-descriptive
  scale_out_rule: use-observed-paired-variance-and-discordance-never-drop-failed-tasks

claim_boundary:
  supports_if_positive: downstream-causal-utility-across-NewtonBench-domains
  does_not_establish:
    - complete-idea-to-paper-superiority
    - human-expert-validity
    - superiority-to-accepted-external-autoresearch-methods
    - ICLR-acceptance-or-oral-readiness
