schema_version: "1.0"
program_id: newtonbench-taste-development-v6
project_id: scitaste-self-development
supersedes: newtonbench-taste-development-v1-through-v5
purpose: collect semantically aligned source-disjoint action/outcome episodes for Taste fitting
unified_scitaste_system: true
research_workload_paradigm: training-free-research
taste_mechanism: frozen-backbone-outcome-updated-controller-state
formal_evidence: false
policy_update_authorized_before_review: false
repairs:
  provider_adapter:
    configuration: configs/model_nodes/zhipu_glm53_flash.newtonbench_development_v5.yaml
    rule: always-thinking-low-effort-with-32768-per-call-and-120000-per-task
  bootstrap_decision_policy:
    turn_1: PROBE
    turn_2: ANALYZE
    turn_3: EXPERIMENT
    later_with_budget: REFINE
    zero_remaining_experiments: STOP
    non_stop_expected_cost: actual-per-turn-experiment-ceiling
    reason: prevent-random-tie-breaks-from-creating-semantically-false-Taste-lessons
  outcome_credit:
    primary_target: immediate-observation-and-successor-belief-update
    terminal_score_role: context-not-turn-level-credit
    noncompliant_agent_action: ineligible-for-controller-credit
  environment_binding:
    exact_law_identity: module-difficulty-system-law-version
    measurement_rng: isolated-per-event-derived-from-environment-seed
    hidden_environment_commitment: required-in-new-protocols-and-receipts
    replay_rule: same-task-seed-and-action-sequence-produces-identical-observations
  action_admission:
    mode: fail-closed-no-retry
    locked_STOP_requires: submit_hypothesis
    locked_active_action_requires: [run_experiments, run_code]
    violation_status: agent_noncompliance
    scorer_invoked_after_violation: false
tasks:
  - configs/evaluation/newtonbench/development_task_gravity_v1.json
  - configs/evaluation/newtonbench/development_task_fourier_v1.json
  - configs/evaluation/newtonbench/development_task_heat_v1.json
source_normalization:
  maximum_admitted_episodes_per_task: 1
  multiple_turns_are_not_independent_samples: true
resource_ceiling:
  api_calls_per_task: 9
  maximum_total_tokens_per_task: 120000
  maximum_output_tokens_per_call: 32768
  maximum_tasks: 3
  gpu_hours: 0
  provider_retries_inside_trajectory: 0
review_contract:
  primary_reviewers: [qwen3.8-max, qwen3-max]
  reviewers_disjoint_from_research_agent: true
  disagreement_policy: quarantine-do-not-average
claim_boundary:
  establishes: development-only-action-local-scientific-outcome-supervision
  does_not_establish: [SciTaste-effectiveness, formal-NewtonBench-performance, human-validity]
retained_diagnosis:
  gravity_bootstrap_v1:
    hidden_law_changed: false
    evidence: identical-controlled-observations-under-explicit-v0-law
    failure_causes:
      - research-agent-misread-tenfold-mass2-effect-as-square-root
      - research-agent-submitted-under-locked-ANALYZE-action
    policy_use: forbidden
