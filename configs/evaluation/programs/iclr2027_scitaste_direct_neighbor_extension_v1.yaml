purpose: >-
  Distinguish the direct neighbors' learned pointwise impact/ideation Taste from
  SciTaste's training-free, outcome-updated lifecycle action policy and its
  downstream autonomous-research effect.

studies:
  - study_id: N1-impact-preference-reproduction
    task: paired-paper-impact-preference
    systems:
      - OpenMOSS-Team/SciJudge-4B-2605
      - Qwen/Qwen3-4B-Instruct-2507
    data_splits: [test, test_ood_year, test_ood_iclr]
    endpoint: position-swap-consistent-pairwise-accuracy-per-split
    interpretation: direct-neighbor-method-reproduction-and-transfer
    title_authority: false
  - study_id: N1b-impact-preference-scale-robustness
    task: paired-paper-impact-preference
    systems:
      - OpenMOSS-Team/SciJudge-30B-2605
      - Qwen/Qwen3-30B-A3B-Instruct-2507
    data_splits: [test, test_ood_year, test_ood_iclr]
    endpoint: architecture-matched-taste-training-effect-and-four-to-thirty-billion-scale-interaction
    activation_rule: execute-after-N1-reproduction-and-exact-identity-resource-disclosure
    interpretation: direct-neighbor-scale-robustness-not-resource-driven-model-selection
    title_authority: false
  - study_id: N2-followup-ideation-training-effect
    task: seed-paper-to-followup-title-and-abstract
    systems:
      - OpenMOSS-Team/SciThinker-4B
      - Qwen/Qwen3-4B-Thinking-2507
    inputs: source-disjoint-seed-papers-frozen-before-generation
    endpoint: generator-blinded-independent-panel-pairwise-preference-with-position-swap
    interpretation: direct-neighbor-preference-alignment-effect
    title_authority: false
  - study_id: N2b-followup-ideation-scale-robustness
    task: seed-paper-to-followup-title-and-abstract
    systems:
      - OpenMOSS-Team/SciThinker-30B
      - Qwen/Qwen3-30B-A3B-Thinking-2507
    inputs: same-frozen-source-disjoint-seed-papers-as-N2
    endpoint: same-generator-blinded-panel-with-scale-by-taste-training-analysis
    activation_rule: execute-after-N2-and-exact-identity-resource-disclosure
    interpretation: direct-neighbor-scale-robustness-not-a-lifecycle-effect
    title_authority: false
  - study_id: N3-lifecycle-transfer-diagnostic
    task: fixed-alternative-lifecycle-action-choice
    systems:
      - OpenMOSS-Team/SciJudge-4B-2605-zero-shot-action-adapter
      - scitaste-native
      - native-base
    inputs: scitastebench-source-disjoint-heldout-decisions
    endpoint: action-quality-calibration-abstention-and-adapter-validity
    interpretation: transfer-boundary-diagnostic-not-a-native-task-comparison
    title_authority: false
  - study_id: E1-core-lifecycle-mechanisms
    task: source-grounded-lifecycle-action-choice
    systems: [base, raw, matched, mismatched, full]
    endpoint: preregistered-H0-H3-mechanism-contrasts
    interpretation: scitaste-core-mechanism-evidence
    title_authority: supporting
  - study_id: E2-downstream-objective-progress
    task: mlrc-hidden-objective-progress
    systems: [scitaste-native, native-base]
    endpoint: paired-hidden-objective-progress-all-failures-retained
    interpretation: only-title-critical-causal-autoresearch-effect
    title_authority: true

reporting:
  aggregate_score_across_studies: forbidden
  matched_model_effects_and_ecological_system_effects_reported_separately: true
  direct_neighbor_native_task_scores_are_not_lifecycle_scores: true
  scijudge_may_review_full_papers: false
  formal_model_selection_from_test_or_hidden_scores: forbidden
  required_tables:
    - direct-neighbor-native-task-reproduction
    - direct-neighbor-scale-by-taste-training-effects
    - lifecycle-transfer-boundaries
    - scitaste-core-mechanism-contrasts
    - downstream-objective-progress
  required_failure_accounting:
    - schema-and-adapter-failures
    - position-swap-inconsistency
    - abstentions
    - execution-failures
    - review-disagreement

execution_state:
  dataset_eval_splits_downloaded: true
  direct_neighbor_checkpoints_complete: false
  exact_base_checkpoints_complete: false
  task_excluded_load_generation_preflight_complete: false
  formal_execution_started: false
