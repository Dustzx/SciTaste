  idea_revision_id: outcome-calibrated-scientific-taste-policy-v2
  locator: outputs/projects/scitaste-self-development/runs/2026-09-15__scitaste-native__outcome-calibrated-taste-idea-v2__seed-00/idea_refinement/REVISION.json
  sha256: 4b592572eb58236def8d273329995472b9f05ce0435fa16b7b551d758b13a765
