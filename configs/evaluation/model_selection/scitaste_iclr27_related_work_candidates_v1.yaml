anchors:
  - work_id: ai-can-learn-scientific-taste
    title: AI Can Learn Scientific Taste
    source_url: https://arxiv.org/abs/2603.14473
    relationship: direct-scientific-taste-neighbor
    reported_models:
      - SciJudge-Qwen3-4B
      - SciJudge-Qwen3-30B
      - SciThinker-Qwen3-4B
      - SciThinker-Qwen3-30B
      - GPT-5.4-Thinking
      - MiniMax-M3-Thinking
      - GLM-5.1-Thinking
      - DeepSeek-v3.2-Thinking
      - GPT-5.2-high
      - GLM-5
      - Gemini-3-Pro
    informs_planes: [taste-impact-judge, taste-ideator, paper-reviewer, adjudicator]
    selection_implication: >-
      Treat released Scientific Judge and Thinker models as direct-neighbor
      baselines, and use an identity-diverse frontier panel for open-ended idea
      preference rather than allowing one generator to judge itself.
  - work_id: institutional-traces-taste
    title: Machines acquire scientific taste from institutional traces
    source_url: https://arxiv.org/abs/2603.16659
    relationship: direct-scientific-taste-neighbor
    reported_models: [eleven-frontier-model-panel, field-specific-finetuned-models]
    informs_planes: [taste-impact-judge, taste-ideator]
    selection_implication: >-
      Preserve a training-based institutional-outcome baseline and compare it
      separately from SciTaste's training-free lifecycle policy; do not treat
      generic frontier reasoning as evidence of learned scientific taste.
  - work_id: mlr-bench
    title: MLR-Bench
    source_url: https://arxiv.org/abs/2505.19955
    relationship: autoresearch-benchmark
    reported_models:
      - o4-mini
      - Claude-3.7-Sonnet
      - DeepSeek-R1
      - Ministral-8B
      - Qwen3-235B-A22B
      - Gemini-2.5-Pro-Preview
      - GPT-4o-Search-Preview
    informs_planes: [taste-ideator, research-agent, code-agent, paper-reviewer]
    selection_implication: >-
      Use stagewise and end-to-end comparisons over multiple model families,
      report matched-backbone and best-native estimands separately, and preserve
      the benchmark-owned task model for executable objective scoring.
  - work_id: ai-scientist-v2
    title: The AI Scientist-v2
    source_url: https://arxiv.org/abs/2504.08066
    relationship: autoresearch-method
    reported_models: [Claude-3.5-Sonnet-v2, GPT-4o]
    informs_planes: [code-agent, figure-reviewer, paper-reviewer]
    selection_implication: >-
      Separate code generation from multimodal figure feedback and paper review;
      historical reported models define replication, not the only current model pool.
  - work_id: deep-scientist
    title: DeepScientist
    source_url: https://arxiv.org/abs/2509.26603
    relationship: autoresearch-method
    reported_models: [Gemini-2.5-Pro, Claude-4-Opus]
    informs_planes: [research-agent, code-agent, paper-reviewer]
    selection_implication: >-
      Retain separate scientific-reasoning and coding roles and include a current
      high-capability family even when it is not present in local inventory.

