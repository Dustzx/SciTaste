role_requirements:
  - plane: taste-impact-judge
    minimum_distinct_families: 2
    required_experimental_roles: [external-neighbor-baseline, primary-matched-candidate]
  - plane: taste-ideator
    minimum_distinct_families: 4
    required_experimental_roles: [external-neighbor-baseline, primary-matched-candidate, cross-model-robustness-candidate]
  - plane: research-agent
    minimum_distinct_families: 4
    required_experimental_roles: [primary-matched-candidate, cross-model-robustness-candidate]
  - plane: code-agent
    minimum_distinct_families: 4
    required_experimental_roles: [external-neighbor-baseline, primary-matched-candidate, cross-model-robustness-candidate]
  - plane: paper-reviewer
    minimum_distinct_families: 4
    required_experimental_roles: [primary-matched-candidate, review-panel-candidate]
  - plane: adjudicator
    minimum_distinct_families: 2
    required_experimental_roles: [primary-matched-candidate, review-panel-candidate]
  - plane: benchmark-task-model
    minimum_distinct_families: 1
    required_experimental_roles: [task-recipe-owned]
