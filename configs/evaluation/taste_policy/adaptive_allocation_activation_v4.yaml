stop_rules:
  - Complete all eight frozen task attempts before reviewing any candidate.
  - Retain zero-candidate, failed, and zero-score trajectories without replacement.
  - Reject submission through the prospectively assigned nonterminal target turn.
  - Select only the fixed action and turn assigned before execution; never harvest another turn.
  - Stop the affected generation on provider drift, malformed output, or any retry request.
  - Do not admit an episode without two independent runtime-bound attribution reviews over one frozen packet.
  - Do not route an episode into adaptive-allocation without two outcome-blind family reviews.
  - Do not launch E2 until the successor head passes the target-domain state probe.
