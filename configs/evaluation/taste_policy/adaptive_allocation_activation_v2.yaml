stop_rules:
  - Complete all nine frozen task attempts before reviewing any candidate.
  - Retain zero-candidate, failed, and zero-score trajectories without replacement.
  - Select only the action stratum assigned before execution; never harvest another turn.
  - Stop the affected generation on provider drift, malformed output, or any retry request.
  - Do not admit an episode without two independent runtime-bound attribution reviews.
  - Do not route an episode into adaptive-allocation without two outcome-blind family reviews.
  - Do not launch E2 until the successor head passes the target-domain state probe.
