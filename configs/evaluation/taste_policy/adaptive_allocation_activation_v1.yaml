stop_rules:
  - Stop before all external execution until the owner approves this exact campaign hash.
  - Stop the affected task on provider drift, malformed structured output, or any retry request.
  - Retain every started task and review failure; do not replace it with another seed or task.
  - Complete all nine frozen tasks; do not stop early after observing policy readiness.
  - Do not admit an episode without two independent runtime-bound attribution reviews.
  - Do not route an episode into adaptive-allocation without two outcome-blind family reviews.
  - Do not launch E2 until the successor head passes the target-domain state probe.
