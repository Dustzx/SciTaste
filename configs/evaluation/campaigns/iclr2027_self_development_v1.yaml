      planned_model_calls: null
    budget:
      api_requests: 1500
      total_tokens: 15000000
      api_cost_usd: 100.0
      allocated_gpu_hours: null
      output_storage_bytes: 107374182400
      human_hours: 30.0
    claim_allowed: >-
      One completed matched block may establish adapter feasibility only; a
      later powered, separately frozen formal study may support package-quality effects.
    claim_forbidden: >-
      The current blocked prepilot cannot establish superiority, ICLR readiness,
      objective progress, provider equivalence, or official peer review.
