tracks:
  - track_id: scientific-taste-decisions
    role: scientific_taste_mechanism
    state: design_only
    scientific_question: >-
      From a fixed broad pool, does content-grounded quality admission improve
      decisions over prestige-only selection; under fixed admitted sources and
      context budgets, does reviewed Taste abstraction improve decisions beyond same-source raw RAG,
      is domain match rather than generic context causal, and can SciTaste select
      applicable source-disjoint precedents without oracle relation labels?
    primary_endpoint: >-
      Condition-blinded independent-expert preference on decision quality and
      claim calibration for registered H0, H1, H2a, and H2b contrasts. Agreement with
      pre-collected action labels is diagnostic only.
    comparison_design: >-
      Resource-independent SciTasteBench v3 design: content-grounded versus
      prestige-only reference selection from one pool, then Base plus same-source raw
      RAG, same-source abstracted Taste, and source-disjoint mismatched Taste;
      a separate paired same-pool selector contrast compares decision-grounded
      deliberation with lexical retrieval. Full SciTaste is optional supporting
      evidence; legacy component cells are not required by H1 or H2a.
    model:
      kind: unselected
      usage_scope: >-
        One capable model identity will be frozen across all conditions only
        after a task-excluded conformance pilot; inventory cannot select it.
    data:
      dataset_id: scitastebench-v3
      role: >-
        At least 120 natural, source-group-disjoint research decisions across
        at least three domains and all six SciTaste decision families.
      item_ids: [aaar-1.0, aries, openreview-public-comments]
      population_floor: 120
      exact_bytes_available: false
      held_out_verified: false
      acquisition_approved: false
    matrix:
      system_ids:
        - quality-grounded-reference-admission
        - prestige-only-reference-selection
        - native-base
        - raw-source-rag
        - matched-abstracted-taste
        - mismatched-taste
      task_ids: []
      seeds: []
      repetitions: 1
      order_arms: 2
      planned_cells: null
      planned_model_calls: null
    budget:
      api_requests: null
      total_tokens: null
      api_cost_usd: null
      allocated_gpu_hours: null
      output_storage_bytes: 107374182400
      human_hours: null
      compute_unallocated: true
    claim_allowed: >-
      After a powered formal split and bound blind reviews, this track may support
      causal H0/H1/H2 claims under one frozen capable-model setting.
    claim_forbidden: >-
      It cannot establish idea-to-paper improvement, frontier-model robustness,
      or an executable-cell count before natural cases and labels are frozen.
    evidence_artifact_ids:
      - iclr-evaluation-contract
      - iclr-evidence-program
      - scientific-reference-mining
      - reference-search-config
      - self-reference-mining-need
      - reference-mining-profiles
      - scientific-reference-quality
      - reference-quality-profiles
      - reference-quality-pipeline
      - dual-estimand-addendum
      - experiment-decision-brief
      - mechanism-source-screen
      - mechanism-governance
      - taste-corpus-curation-guide
      - gpu-host-inventory
    blocker_codes:
      - natural-case-bytes:not-acquired
      - prestige-blind-quality-projections:not-materialized
      - quality-screen-model-traces:not-collected
      - expert-labels:not-collected
      - held-out-split:not-verified
      - exact-cell-plan:not-compilable-before-curation
      - primary-model:not-selected-before-outcomes
      - blinded-endpoint-reviews:not-collected

  - track_id: native-taste-causal-prepilot
    role: native_taste_causal
    state: blocked
    scientific_question: >-
      With executor, model, task, controller-owned candidate templates and
      admission, tools, seed, and budgets fixed, do the complete Taste bundle and matched Taste context improve
      objective task progress, and what mechanisms do component-only arms suggest?
    primary_endpoint: >-
      Equal-task paired objective progress for two confirmatory Full-versus-Base
      and Full-versus-mismatched-Taste contrasts, with three mandatory
      component-only diagnostics and valid failures retained at the floor.
    comparison_design: >-
      One matched GPU lane with six native conditions, two objective-task
      candidates, one prepilot seed, two confirmation obligations, three
      mechanism diagnostics, and no model confounding.
    model:
      kind: gpu
      usage_scope: One identical checkpoint and execution envelope for every native condition.
      model_id: Qwen3-VL-2B-Instruct
      model_revision: local-tree-47f9c0e0
      checkpoint_source_path: /media/good/dxhismyson/weights/Qwen3-VL-2B-Instruct
      checkpoint_sha256: 47f9c0e0e48a54c74fb0b2b0ffa7a182fed381d5ed49a0200872038d1c286d34
      device_count: 8
      device_name: NVIDIA GeForce RTX 3090
    data:
      dataset_id: mlrc-first-preflight
      role: Two qualified 16-GB objective-task candidates for feasibility only.
      item_ids: [perception-temporal-action-loc, meta-learning]
      population_floor: null
      exact_bytes_available: true
      held_out_verified: false
      acquisition_approved: true
    matrix:
      system_ids:
        - full-scitaste
        - native-base
        - native-knowledge
        - native-taste
        - native-critics
        - mismatched-taste-placebo
      task_ids: [perception-temporal-action-loc, meta-learning]
      seeds: [7]
      repetitions: 1
      order_arms: 1
      planned_cells: 12
      planned_model_calls: null
    budget:
      api_requests: null
      total_tokens: null
      api_cost_usd: null
      allocated_gpu_hours: 5.0
      output_storage_bytes: 107374182400
      human_hours: 12.0
    claim_allowed: >-
      A complete prepilot may establish feasibility and treatment isolation,
      report all confirmation and diagnostic analyses, expose failures and
      reviewer burden, and supply variance inputs for a new powered proposal.
    claim_forbidden: >-
      One seed and two candidate tasks cannot establish the title, a formal
      causal effect, broad generality, external-system superiority, or marginal
      effects of any individual component.
    evidence_artifact_ids:
      - iclr-evaluation-contract
      - dual-estimand-addendum
      - dual-estimand-governance
      - resource-corpus-v8
