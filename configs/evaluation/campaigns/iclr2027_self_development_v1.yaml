schema_version: "1.0"
dossier_id: iclr2027-scitaste-self-development-v1
project_id: scitaste-self-development
paper_title: "SciTaste: Improving Autonomous Research through Scientific Taste"
target_venue: ICLR 2027
central_question: >-
  Under matched information and resource budgets, does explicit,
  precedent-informed scientific Taste improve autonomous research decisions and
  the evidence validity of complete idea-to-paper trajectories?
claim_boundary: >-
  Engineering tests and recursive self-development establish implementation
  readiness and ecological usefulness only. The title-level improvement claim
  requires held-out mechanism evidence plus an independently reviewed formal
  result; pilot, model-review, or self-iteration outputs cannot establish it.
