      - native-condition-implementation-attestation
      - taste-corpus-curation-guide
      - mlrc-first-assets
      - mlrc-first-acquisition
      - mlrc-license-policy
      - gpu-host-inventory
    blocker_codes:
      - taste-corpora:source-and-review-bytes-not-present
      - taste-corpora:paired-qualification-not-complete
      - task-assets:zip-read-and-safety-qualification-not-authorized
      - held-out-audit:not-complete
      - remote-checkpoint:not-attested
      - independent-reviewers:not-secured
      - proposal:not-owner-approved

  - track_id: external-best-native-prepilot
    role: end_to_end_external_systems
    state: blocked
    scientific_question: >-
      Under common task/output budgets and each accepted system's pinned native
      model, how do complete research packages, failures, and costs compare?
    primary_endpoint: >-
      Condition-blinded independent-expert preference for scientific value and
      evidence validity, retaining ties and valid failed trajectories.
    comparison_design: >-
      Three real systems over two objective-task candidates and one feasibility
      seed; per-system models are explicit and model effects remain confounded.
    model:
      kind: api
      usage_scope: Best-native identities are bound per system and never pooled as one backbone.
