tracks:
  - track_id: scientific-taste-mechanism
    role: scientific_taste_mechanism
    state: design_only
    scientific_question: >-
      Does matched, abstracted scientific Taste improve expert-aligned choices
      beyond Base, factual Knowledge, critics, and mismatched Taste?
    primary_endpoint: >-
      Paired expert-aligned action selection for Full SciTaste versus Base,
      clustered by source group; calibration and wrong-level decisions are secondary.
    comparison_design: >-
      Six-condition within-case mechanism ablation with declared and reversed
      action order; matched Taste versus source-disjoint mismatched Taste is the
      negative control.
    model:
      kind: gpu
      usage_scope: Fixed local controller for every decision condition and order arm.
      provider_id: null
      model_id: Qwen3-VL-2B-Instruct
      model_revision: 8e95e5f6d2ce9219e40be475c077700c51495889166d38cf99c17acd6513b7a1
      api_key_env: null
      checkpoint_source_path: /media/good/dxhismyson/weights/Qwen3-VL-2B-Instruct
      checkpoint_sha256: 8e95e5f6d2ce9219e40be475c077700c51495889166d38cf99c17acd6513b7a1
      device_count: 8
      device_name: NVIDIA GeForce RTX 3090
    data:
      dataset_id: scitastebench-v2
      role: >-
        At least 120 natural, source-group-disjoint research decisions across
        at least three domains and all six SciTaste decision families.
      item_ids: [aaar-1.0, aries, openreview-public-comments]
      population_floor: 120
      exact_bytes_available: false
      held_out_verified: false
      acquisition_approved: false
    matrix:
      system_ids:
        - native-base
        - native-knowledge
        - native-taste
        - native-critics
        - full-scitaste
        - mismatched-taste-placebo
      task_ids: []
      seeds: []
      repetitions: 1
      order_arms: 2
      planned_cells: null
      planned_model_calls: 1440
    budget:
      api_requests: null
      total_tokens: null
      api_cost_usd: null
      allocated_gpu_hours: 16.0
      output_storage_bytes: 107374182400
      human_hours: null
    claim_allowed: >-
      After a powered formal split, this track may support a causal claim about
      expert-aligned scientific decisions under the fixed small-model setting.
    claim_forbidden: >-
      It cannot establish full idea-to-paper superiority, frontier-model
      robustness, official peer review, or an executable-cell count before the
      natural cases and labels are frozen.
    evidence_artifact_ids:
      - experiment-decision-brief
      - mechanism-source-screen
      - mechanism-governance
      - gpu-host-inventory
    blocker_codes:
      - natural-case-bytes:not-acquired
      - expert-labels:not-collected
      - held-out-split:not-verified
      - exact-cell-plan:not-compilable-before-curation
      - remote-checkpoint:not-attested
  - track_id: external-idea-to-paper
    role: end_to_end_external_systems
    state: blocked
    scientific_question: >-
      Under matched starting briefs, tools, repair policy, and budgets, are
      complete SciTaste Native research packages preferred by blinded experts?
    primary_endpoint: >-
      Task-averaged, condition-blinded independent expert package preference for
      scientific value and evidence validity, retaining ties and failures.
    comparison_design: >-
      The 100-unit DeepSeek V4.1 matched-backbone proposal is non-launchable
      because two accepted upstream systems do not preserve the requested
      backbone. Its size is a ceiling, not a quota. The owner must choose a
      genuinely common backbone or a separately labelled best-native,
      model-confounded design; formal repetition follows pilot power analysis.
    model:
      kind: api
      usage_scope: >-
        Current candidate controller for SciTaste Native and Direct Agent; it is
        not yet a verified unchanged-core backbone for the accepted comparators.
      provider_id: deepseek
      model_id: deepseek-flash
      model_revision: DeepSeek-V4.1-Flash
      api_key_env: DEEPSEEK_API_KEY
      checkpoint_source_path: null
      checkpoint_sha256: null
      device_count: null
      device_name: null
    data:
      dataset_id: mlr-bench-official-ten
      role: >-
        Ten ICLR-2025 workshop-derived open research briefs used for complete
        research-package review; they do not expose fixed objective progress.
      item_ids:
        - iclr2025_bi_align
        - iclr2025_buildingtrust
        - iclr2025_data_problems
        - iclr2025_dl4c
        - iclr2025_mldpr
        - iclr2025_question
        - iclr2025_scope
        - iclr2025_scsl
        - iclr2025_verifai
        - iclr2025_wsl
      population_floor: null
      exact_bytes_available: false
      held_out_verified: false
      acquisition_approved: false
    matrix:
      system_ids:
