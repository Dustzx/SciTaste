schema_version: "1.1"
dossier_id: iclr2027-scitaste-self-development-v1
project_id: scitaste-self-development
paper_title: "SciTaste: Improving Autonomous Research through Scientific Taste"
target_venue: ICLR 2027
central_question: >-
  Under matched information and resource budgets, does explicit,
  precedent-informed scientific Taste improve autonomous research decisions and
  evidence-valid idea-to-paper trajectories?
claim_boundary: >-
  The title-level claim requires a complete positive held-out native Taste
  intervention with Full--Base and Full--mismatched-Taste confirmation, plus
  complete separately interpreted component-only diagnostics.
  Best-native external comparisons are model-confounded ecological evidence;
  engineering, pilot, model-review, and self-iteration outputs establish neither.
