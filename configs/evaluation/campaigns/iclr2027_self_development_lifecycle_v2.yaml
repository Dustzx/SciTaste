schema_version: "1.2"
dossier_id: iclr2027-scitaste-lifecycle-v2
project_id: scitaste-self-development
paper_title: "SciTaste: Grounded Scientific Taste for Autonomous Research"
target_venue: ICLR 2027
central_question: >-
  Under the same model, information, tools, executor, and budget, does a unified
  lifecycle Scientific Taste policy learned from grounded decisions and reviewed
  delayed outcomes improve held-out research decisions and objective progress?
claim_boundary: >-
  A title-level improvement claim requires positive source-group-disjoint H1
  grounding, H2 transfer, H2b selection, H3 delayed-credit, and H4 objective
  progress evidence. The self-development case, repository tests, generated
  papers, and external best-native systems cannot establish that causal effect.
