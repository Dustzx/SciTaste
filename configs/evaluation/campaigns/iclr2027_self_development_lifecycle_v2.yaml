tracks:
  - track_id: lifecycle-decision-mechanism
    role: scientific_taste_mechanism
    state: design_only
    scientific_question: >-
      Do grounded, in-scope precedents selected without oracle labels improve
      decisions beyond raw retrieval, and does independently reviewed delayed
      credit improve the same policy beyond no update and shuffled credit?
    primary_endpoint: >-
      Condition-blinded expert preference over held-out actions and claim
      calibration, with abstention, reversal, transfer error, and calibration diagnostics.
    comparison_design: >-
      H1 same-source grounding, H2 matched transfer, H2b decision-grounded
      selection, and H3 outcome-updated versus no-update policy with shuffled credit.
    model:
      kind: unselected
      usage_scope: >-
        One exact capable model is frozen only after a task-excluded conformance pilot.
    data:
      dataset_id: scitastebench-natural-lifecycle-v1
      role: >-
        Natural decisions with pre-action evidence, closed alternatives, delayed
        outcomes, attribution review, source groups, and held-out partitions.
      item_ids: []
      population_floor: 120
      exact_bytes_available: false
      held_out_verified: false
      acquisition_approved: false
    matrix:
      system_ids:
        - matched-abstracted-taste
        - raw-source-rag
        - mismatched-taste
        - deliberative-taste-selection
        - lexical-taste-retrieval
        - outcome-updated-policy
        - no-update-policy
        - shuffled-credit-policy
      task_ids: []
      seeds: []
      repetitions: 1
      order_arms: 2
      planned_cells: null
      planned_model_calls: null
    budget:
      api_requests: null
      total_tokens: null
      api_cost_usd: null
      allocated_gpu_hours: null
      output_storage_bytes: 107374182400
      human_hours: null
      compute_unallocated: true
    claim_allowed: >-
      A powered, independently reviewed formal split may support bounded H1--H3 effects.
    claim_forbidden: >-
      Fixtures, self-project episodes, automated judges, or an arbitrary cell count
      cannot establish learned Scientific Taste.
    evidence_artifact_ids:
      - lifecycle-evidence-program-v2
      - lifecycle-evidence-review-v2
    blocker_codes:
      - natural-episodes-not-admitted
      - independent-attribution-not-complete
      - formal-split-not-frozen
      - primary-model-not-selected
      - power-analysis-not-complete
      - reviewers-not-secured

  - track_id: native-objective-progress
    role: native_taste_causal
    state: design_only
    scientific_question: >-
      Does toggling only the learned lifecycle policy improve objective progress
      in the same SciTaste Native executor?
    primary_endpoint: Paired scorer-owned held-out objective progress with every failure retained.
    comparison_design: >-
      Learned outcome-updated policy on versus zero learned-policy adjustment,
      with model, state, information, tools, repair rules, executor, and budget fixed.
    model:
      kind: unselected
      usage_scope: One exact capable model is frozen after task-excluded conformance.
    data:
      dataset_id: innovatorbench-heldout-objective-v1
      role: Independently qualified executable tasks with scorer-owned hidden outcomes.
      item_ids: []
      population_floor: 1
      exact_bytes_available: false
      held_out_verified: false
      acquisition_approved: false
    matrix:
      system_ids: [full-scitaste-learned-policy, native-base-without-learned-taste]
      task_ids: []
      seeds: []
      repetitions: 1
      order_arms: 1
      planned_cells: null
      planned_model_calls: null
    budget:
      api_requests: null
      total_tokens: null
      api_cost_usd: null
      allocated_gpu_hours: null
      output_storage_bytes: 107374182400
      human_hours: null
      compute_unallocated: true
    claim_allowed: A powered held-out formal block may support the H4 within-native effect.
    claim_forbidden: Package persuasiveness or unequal executor resources cannot support H4.
    evidence_artifact_ids:
      - lifecycle-evidence-program-v2
      - accepted-resource-corpus-v9
    blocker_codes:
