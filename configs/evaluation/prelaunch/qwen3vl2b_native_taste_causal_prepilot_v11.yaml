stop_rules:
  - Stop before dataset acquisition, SSH, GPU/model use, or experiment execution until exact task bytes, executable environments, remote checkpoint identity, sandbox, independent reviewers, and owner approval pass.
  - The bounded generation, selection, and human-governed corpus construction runtimes are statically qualified by preflight v3; stop until real source/review bytes qualify and the pinned checkpoint executes the model path under explicit approval.
  - Stop unless matched and placebo Taste corpora are paired on stage and decision role, eligible and retrieved case counts, token budget, provenance tier, curation tier, and outcome-information availability.
  - Stop the matched block on zero matched or placebo retrieval, candidate-set asymmetry, task, scorer, model, tool, repair, seed, budget, or condition-implementation drift; retain every attempt.
  - Stop on missing or invalid telemetry, artifacts, blinding, intervention-isolation checks, or reviewer attestations; do not relabel invalid evidence as failure.
  - Stop after one complete twelve-cell block and inspect feasibility, variance, and failures before creating any powered formal proposal.
