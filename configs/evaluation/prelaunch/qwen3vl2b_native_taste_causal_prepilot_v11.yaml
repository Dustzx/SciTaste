study_scope: pilot
scientific_question: >-
  With executor, Qwen3-VL-2B checkpoint, task bytes, controller-owned action
  templates, candidate admission, tools, repair rules, seed, and resource ceilings
  fixed, does a complete Scientific Taste bundle with matched precedents and
  critics improve objective research progress over no-Taste and a
  source-disjoint mismatched-Taste placebo, and what mechanisms are suggested by
  component-only conditions?
claim_allowed: >-
  A complete prepilot may establish implementation and measurement feasibility,
  test isolation of the two confirmatory interventions, report all three
  component-only mechanism diagnostics, expose failures, and estimate variance
  and reviewer burden for a new powered formal proposal.
claim_forbidden: >-
  This two-task one-seed prepilot cannot establish the paper title, a formal
  causal effect, generality beyond the admitted tasks and checkpoint,
  external-system superiority, marginal effects of individual components, or
  official peer-review readiness. Component-only contrasts are diagnostics and
  must not be relabelled as leave-one-out causal ablations.
