analysis:
  primary_outcome: >-
    Task-normalized held-out objective progress, assigning every valid failed
    intention-to-run cell the preregistered task floor.
  estimand: >-
    Equal-task paired mean differences under one fixed Qwen3-VL-2B execution
    envelope. Full-versus-Base and Full-versus-mismatched-Taste are confirmatory;
    Full-versus-Knowledge-only, Taste-only, and critics-only are reported as
    mechanism diagnostics and do not determine the title claim.
  analysis_unit: One paired task-by-seed trajectory for Full and one exact control.
  aggregation_method: >-
    Score each task with its frozen evaluator, normalize only by preregistered
    constants, retain valid failures at the task floor, pair by task and seed,
    and report all five contrasts, raw failures, resource use, retrieval counts,
    model-decision traces, candidate-generation parity, source-abstraction
    review identity, and intervention-isolation checks without favorable-result
    selection.
  uncertainty_method: >-
    This prepilot reports descriptive paired effects and task-level dispersion
    only; a task-clustered interval and power analysis must be frozen in a new
    formal proposal without inspecting formal outcomes.
