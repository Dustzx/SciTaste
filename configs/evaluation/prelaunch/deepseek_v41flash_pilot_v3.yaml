analysis:
  primary_outcome: Task-normalized final objective progress with failed or invalid cells assigned the preregistered task floor.
  estimand: Equally task-weighted paired mean difference between SciTaste Native and the strongest admitted accepted external method within each matched task-by-seed block; pilot use is variance estimation only.
  analysis_unit: One matched task-by-seed block with every preregistered system retained intention-to-run.
  aggregation_method: Average seeds within task and then average tasks equally; report direct and each-system contrasts separately with Holm correction.
  uncertainty_method: Task-stratified paired bootstrap 95 percent interval plus paired sign-flip test when the admitted task count permits.
  power_analysis_ref: null
  power_analysis_sha256: null
