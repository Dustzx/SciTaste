stop_rules:
  - Stop before the first paid call if the authenticated provider identity differs from deepseek-flash or the served revision cannot be recorded.
  - Stop unless at least two accepted external method systems pass unchanged-core adapter, license, task-equivalence, telemetry, sandbox, artifact, and failure-resume gates.
  - Stop the complete matched block if any system changes task semantics, tools, starting evidence, repair policy, or resource ceilings.
  - Stop on incomplete token, retry, cost, wall-time, intervention, experiment, or artifact telemetry.
  - Stop after one clean block and request a second approval before any scale-out.
