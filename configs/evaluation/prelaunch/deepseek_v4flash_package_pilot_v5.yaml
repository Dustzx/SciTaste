study_scope: pilot
scientific_question: >-
  Under matched starting briefs, information access, model revision, tools,
  repair rules, and resource ceilings, does SciTaste Native produce complete
  research packages that independent blinded experts prefer for scientific
  value and evidence validity over packages from real accepted AutoResearch
  systems?
claim_allowed: >-
  A completed clean block may establish adapter feasibility, failure modes,
  reviewer workload, and pilot variance for a later power analysis only.
claim_forbidden: >-
  This pilot cannot establish SciTaste superiority, ICLR readiness, field-wide
  effectiveness, provider equivalence, an objective-progress result, or an
  official peer-review outcome.
