stop_rules:
  - Do not run or download a task until its exact starting bytes, license, held-out audit, and runtime-acquisition policy pass.
  - Stop before the first paid call if the authenticated provider identity differs from deepseek-v4-flash or the served revision cannot be recorded.
  - Stop unless at least two accepted external method systems pass unchanged-core adapter, license, task-equivalence, telemetry, sandbox, artifact, and failure-resume gates.
  - Stop unless two conflict-checked independent expert reviewers per comparison and the adjudication process are secured before scale-out.
  - Stop the complete matched block if any system changes task semantics, starting evidence, tools, repair policy, or resource ceilings.
  - Stop on incomplete token, retry, cost, wall-time, intervention, experiment, artifact, or reviewer telemetry; retain every attempt.
  - Stop after one clean matched block and request a second approval before any scale-out.
