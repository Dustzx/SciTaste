analysis:
  primary_outcome: >-
    Condition-blinded independent expert pairwise preference for the scientific
    value and evidence validity of the complete research package, with ties
    retained.
  estimand: >-
    Task-averaged probability that a blinded reviewer prefers SciTaste Native
    to each preregistered accepted external comparator; every comparator
    contrast is reported rather than selecting the most favourable one.
  analysis_unit: One matched system-task-seed research trajectory reviewed as a complete package.
  aggregation_method: >-
    Fit the preregistered task- and reviewer-aware paired preference model;
    report raw wins, ties, losses, reviewer agreement, adjudication, failures,
    and each comparator contrast with the prespecified multiplicity correction.
  uncertainty_method: >-
    Report 95 percent intervals from the paired preference model and a
    task-clustered bootstrap sensitivity analysis; the pilot estimates variance
    and reviewer burden only.
  power_analysis_ref: null
  power_analysis_sha256: null
