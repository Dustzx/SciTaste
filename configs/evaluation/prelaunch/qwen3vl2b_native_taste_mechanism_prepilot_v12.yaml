study_scope: pilot
scientific_question: >-
  With task bytes, agent checkpoint, editable surface, objective scorer, tools,
  repair policy, starting state, seed, and resource ceilings fixed, does Scientific
  Taste improve autonomous research through (i) abstraction of the same qualified
  sources, (ii) task-domain matching of equally represented Taste, and (iii) the
  complete SciTaste bundle?
claim_allowed: >-
  A Perception-only five-cell execution may establish end-to-end feasibility,
  intervention isolation, scorer closure, failure behavior, and observed resource
  demand. A complete two-task prepilot may estimate task-level dispersion and
  inform a separately frozen formal power analysis.
claim_forbidden: >-
  This prepilot cannot establish the paper title, a formal causal effect,
  cross-task or cross-model generality, external-system superiority, or ICLR
  readiness. The Perception-only first block is not an independent-task effect
  estimate and must not determine a favorable formal sample size.
