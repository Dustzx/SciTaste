analysis:
  primary_outcome: >-
    Task-normalized held-out objective progress, assigning every valid failed
    intention-to-run cell the preregistered task floor.
  estimand: >-
    Three paired differences under one fixed Qwen3-VL-2B execution envelope:
    Full minus Base, matched abstracted Taste minus identical-source Raw RAG, and
    matched minus source-disjoint mismatched Taste.
  analysis_unit: >-
    One independent held-out task after averaging paired seed/repetition blocks.
  aggregation_method: >-
    Normalize only by frozen task constants, retain valid failures at the task
    floor, average within task, give tasks equal weight, and apply Holm correction
    to the three confirmatory contrasts without favorable-result selection.
  uncertainty_method: >-
    This prepilot reports descriptive task effects only. A new formal protocol
    must freeze task count and replication from a task-clustered power simulation
    without inspecting formal outcomes.
