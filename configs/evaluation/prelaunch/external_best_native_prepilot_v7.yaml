study_scope: pilot
scientific_question: >-
  Under common frozen task and output budgets but each accepted system's pinned
  native model configuration, how do complete SciTaste Native, Agent Laboratory,
  and TinyScientist research packages compare in blinded scientific value,
  evidence validity, failures, and resource cost?
claim_allowed: >-
  A complete prepilot may establish best-native adapter feasibility, ecological
  failure modes, reviewer burden, resource variance, and whether a larger
  external comparison is justified.
claim_forbidden: >-
  Model-confounded best-native evidence cannot establish the causal value of
  Scientific Taste, a matched-backbone system effect, title-level improvement,
  broad external superiority, or official peer review.
