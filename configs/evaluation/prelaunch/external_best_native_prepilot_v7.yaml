  - Stop if an authenticated provider returns a different model identity or if o3-mini is unavailable or past its registered retirement boundary.
  - Stop on task, tool, repair, budget, sandbox, telemetry, or output-contract asymmetry; retain every attempt and valid failure.
  - Stop after one complete six-cell block and inspect feasibility before any larger ecological proposal.
