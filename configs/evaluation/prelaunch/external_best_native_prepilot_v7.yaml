analysis:
  primary_outcome: >-
    Condition-blinded independent-expert pairwise preference for scientific
    value and evidence validity of the complete research package, retaining
    ties and valid failed trajectories.
  estimand: >-
    Equal-task probability that reviewers prefer SciTaste Native to each
    accepted comparator under each system's pinned native model configuration;
    model and framework effects remain inseparable.
  analysis_unit: One paired task-by-seed complete research trajectory.
  aggregation_method: >-
    Pair complete packages by task and seed, retain failures in the
    intention-to-run population, report both declared contrasts, raw wins,
    ties, losses, reviewer agreement, objective scores, and resource telemetry.
  uncertainty_method: >-
    This prepilot reports descriptive paired effects and reviewer dispersion
    only; a reviewer- and task-aware interval and power analysis must be frozen
    in a new formal ecological proposal.
