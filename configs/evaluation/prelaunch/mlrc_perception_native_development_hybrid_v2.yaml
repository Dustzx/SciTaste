stop_rules:
  - Stop before launch unless a fresh read-only inventory exposes one device with the required free memory and at least 32 GiB workspace storage.
  - Stop on API identity drift, task-byte drift, initialization drift, condition asymmetry, or missing resource telemetry; retain the failed attempt.
  - Execute the two cells sequentially and do not inspect one arm to edit the other.
  - Stop after the complete pair; do not promote development mAP to formal held-out evidence.
