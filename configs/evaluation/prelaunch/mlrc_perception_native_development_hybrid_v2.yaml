study_scope: pilot
scientific_question: >-
  Under the same Qwen3.8-Max research-agent identity, MLRC task bytes,
  LocPointTransformer random initialization, tools, seed, runtime, and budgets,
  does enabling the learned SciTaste lifecycle policy change development-set
  objective progress relative to the otherwise identical native controller?
claim_allowed: >-
  This two-cell development execution may demonstrate that the project-level
  API-agent plus GPU-task-training path is executable and estimate one paired
  development effect for planning the later frozen multi-task evaluation.
claim_forbidden: >-
  This pilot cannot establish title-level effectiveness, benchmark superiority,
  generality, statistical significance, formal held-out performance, or an
  external-system comparison. It is one internal matched control, not the paper's
  main comparison table.
