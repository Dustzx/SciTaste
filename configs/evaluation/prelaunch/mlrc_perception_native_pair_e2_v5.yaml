stop_rules:
  - Stop on any bound-file, source-commit, package-version, or checkpoint identity mismatch.
  - Stop before the development pair until the one-shot task-excluded role gate has selected one exact agent model and that model has completed one bounded structured generation on its allocated route.
  - Stop before the development pair until the exact adaptive-allocation policy is support-ready and an outcome-blind state probe proves active, feedback-sensitive ON/OFF behavior in the target domain.
  - Stop before the formal pair until task-excluded role conformance selects and freezes the exact agent model for both arms.
  - Stop before the formal pair until the exact two-arm development loop completes without opening real held-out labels or scores.
  - Stop on any held-out-label mount, scorer mount, network route, or score feedback visible to the candidate process.
  - Stop if code, environment, task checkpoint, or inference parameters change after candidate freeze.
  - Stop a cell at its wall-time, token, active-GPU-time, RAM, or disk ceiling and retain it as an intention-to-run failure.
  - Stop rather than retry, replace, or manually repair a failed formal cell; retry count is zero.
  - Stop both arms on model/provider drift or loss of exact matched-model identity.
  - Stop on license, safety, storage-isolation, or scorer-parity failure.
  - Stop before any GPU/API/benchmark execution until the exact manifest hash and activation are owner approved.
  - Do not inspect unblinded arm effects to decide early stopping, model replacement, or B2 scale-out.

