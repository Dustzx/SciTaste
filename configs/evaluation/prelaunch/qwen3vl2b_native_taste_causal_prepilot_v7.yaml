analysis:
  primary_outcome: >-
    Task-normalized held-out objective progress, assigning every valid failed
    intention-to-run cell the preregistered task floor.
  estimand: >-
    Equal-task paired mean difference between Full SciTaste and each declared
    ablation under the identical Qwen3-VL-2B execution envelope; all five
    contrasts are reported without selecting the most favorable result.
  analysis_unit: One paired task-by-seed trajectory for Full and one exact control.
  aggregation_method: >-
    Score each task with its frozen evaluator, normalize only by preregistered
    constants, retain valid failures at the task floor, pair by task and seed,
    and report every contrast plus raw failures and resource use.
  uncertainty_method: >-
    This prepilot reports descriptive paired effects and task-level dispersion
    only; a task-clustered interval and power analysis must be frozen in a new
    formal proposal.
