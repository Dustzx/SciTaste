review_question: >-
  Does this proposed Scientific Taste abstraction faithfully reconstruct one closed,
  source-grounded decision and state a useful but bounded transfer principle, without adding
  claims unsupported by the exact source projection?
criterion_instructions:
  grounding-sufficiency: >-
    Verify that the exact excerpts jointly support the context, evidence state, alternatives,
    choice, principle, and any available outcome; do not reward merely extractive overlap.
  closed-alternatives: >-
    Verify that the candidate set states the live decision tension, that the preferred action is
    one candidate, and that every other candidate is explicitly and coherently rejected.
  transfer-boundary-quality: >-
    Verify that applicability and failure conditions are concrete, the counterfactual could
    change the action, and discarded source details prevent unjustified universalization.
  unsupported-claims: >-
    Check every abstraction statement against the exact source projection, including synthesis
    prose not quoted as grounding; mark present when an external fact or stronger claim is added.
accept_rule: >-
  Accept only when grounding is sufficient, alternatives are closed, the transfer boundary is
  sufficient, unsupported claims are absent, and there are no issue codes.
reject_rule: >-
  Reject when at least one criterion is substantively deficient and identify the deficiency with
  a stable issue code and concise rationale.
dispute_rule: >-
  Return needs-dispute only for a concrete ambiguity that prevents a decisive accept or reject;
  identify that ambiguity with a stable issue code. The controller, not the reviewer, decides
  whether a third model is called.
maximum_rationale_characters: 6000
generation_provider_and_model_hidden: true
source_condition_hidden: true
primary_reviewers_blinded_to_each_other: true
adjudicator_sees_disputed_items_only: true
adjudicator_sees_no_primary_outputs: true
reviewer_kind: ai
not_human_review: true
