protocol_status: candidate-awaiting-git-freeze-receipt
purpose: Measure repeated-invocation consistency on a new source-group-disjoint reserve
  sample after v6 exposed that harmless own-trigger/context overlap was rejected by
  the runner. V7 retains such overlap exactly rather than repairing source text.
claim_boundary: This is a bounded AI engineering calibration on new ARIES and F1000
  source groups, not human or expert annotation. A/B agreement estimates repeated-invocation
  consistency under the provider-reported glm-5.3-flash rolling alias; same-model
  C only adjudicates disagreements. Own-trigger/context overlap is retained exactly
  and reported, not treated as a provider failure. Results cannot establish human
  validity, benchmark validity, Scientific Taste effectiveness, or scaled-execution
  authority.
