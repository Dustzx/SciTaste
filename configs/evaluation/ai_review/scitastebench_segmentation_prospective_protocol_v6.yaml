input_firewall:
  allowed:
    - frozen segmentation rubric
    - assigned scientific item abstract
    - assigned scientific item review comment
    - opaque campaign and review item identifiers
    - deterministic source evidence-unit table
  forbidden:
    - private item map
    - publisher or source identity
    - recommendation
    - author response
    - later revision
    - population outcome
    - another segmenter output
    - arbitrary tools
    - web search
  request_payload_must_be_persisted_before_provider_contact: true
  no_provider_tools_exposed: true
  structured_source_identity_fields_withheld: true
  explicit_outcome_fields_withheld: true
  parametric_source_recognition_ruled_out: false
  boundary_statement: >-
    The provider sees complete review text and offset-free surface units. Structured
    source identity, outcome, peer-output, tool, character-offset, and dedicated
    span-transcription fields are absent; semantic recognition is not claimed absent.
adjudication_input_firewall:
  allowed:
    - frozen adjudication rubric
    - assigned disputed item abstract and review comment
    - typed agreement blockers
    - two anonymous segmenter candidates in hash-randomized order
    - opaque campaign and review item identifiers
    - deterministic source evidence-unit table
  forbidden:
    - private item map
    - publisher or source identity
    - recommendation
    - author response
    - later revision
    - population outcome
    - non-disputed items
    - segmenter slot identities
    - arbitrary tools
    - web search
  disputed_items_only: true
  exact_agreement_items_copied_deterministically: true
  candidate_order_anonymized_and_hash_randomized: true
  no_provider_tools_exposed: true
  structured_source_identity_fields_withheld: true
  explicit_outcome_fields_withheld: true
  parametric_source_recognition_ruled_out: false
  boundary_statement: >-
    C sees only disputed review text, offset-free units, typed blockers, and anonymous
    candidates. Structured source/outcome fields and slot identities are absent;
    semantic source recognition from text or memory remains possible.
