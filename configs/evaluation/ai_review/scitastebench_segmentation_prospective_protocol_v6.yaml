schema_version: "1.5"
protocol_id: scitastebench-segmentation-prospective-calibration-v6
project_id: scitaste-self-development
protocol_created_at: 2026-09-15T07:06:27+08:00
protocol_status: candidate-awaiting-git-freeze-receipt
purpose: >-
  Measure whether independent invocations under one fixed API model condition can
  reproducibly recover decision triggers, shared interpretive context, and primary
  decision families on a source-group-disjoint calibration sample.
claim_boundary: >-
  This is a bounded AI engineering calibration, not human or expert annotation.
  A/B agreement estimates repeated-invocation consistency under the provider-reported
  glm-5.3-flash rolling alias; same-model C only adjudicates disagreements and adds no
  independent validity. This protocol cannot authenticate checkpoint weights. Structured
  source fields are withheld, but semantic source recognition from review text or
  parametric memory cannot be ruled out. Group-bootstrap intervals are descriptive
  superpopulation work-model diagnostics, not finite-inventory uncertainty, benchmark
  validity, Scientific Taste effectiveness, scaled-execution authority, or ICLR evidence.
