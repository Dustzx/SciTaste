  candidate_downloads_allowed: true
  scientific_design_may_require_models_absent_from_inventory: true
  freeze_after_conformance:
    - exact_model_identity
    - role_assignment
    - prompt_and_tool_contract
    - inference_parameters
    - cost_and_latency_budget
  additional_gates:
    - license-and-provenance-review
    - bounded-load-or-endpoint-preflight
    - judge-independence-and-calibration
  notes:
    - Role fit below admits a candidate to conformance; it is not an experiment selection.
    - Conformance tasks must be disjoint from every formal benchmark development, validation, and test task used for reported estimates.
    - Task-training models are benchmark executors or trainable backbones, never SciTaste decision authorities.

role_status_vocabulary:
  candidate: General candidate for a task-excluded conformance window.
  specialist_candidate: Candidate only for the named modality or pipeline substage.
  baseline_candidate: Useful as a bounded baseline, sensitivity slice, or compatibility model.
  blocked: Not eligible until the stated blocker is cleared.
  not_applicable: The resource does not implement this role.

