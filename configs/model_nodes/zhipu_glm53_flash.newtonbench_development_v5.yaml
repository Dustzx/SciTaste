# Development-only structured action backend. GLM-5.3-Flash always reasons;
# the v4 8k envelope terminated with finish_reason=length. This ceiling allows
# the provider's hidden reasoning plus one short JSON action while the task-level
# 120k token budget remains the hard aggregate bound.
provider: zhipu-direct
base_url: https://open.bigmodel.cn/api/paas/v4
model: glm-5.3-flash
api_key_env: ZAI_API_KEY
live_enabled: true
timeout_seconds: 600
max_retries: 0
max_output_tokens: 32768
pricing_confirmed: false
pricing: null
unpriced_engineering_probe: true
extra_headers: {}
extra_body:
  thinking:
    type: enabled
  reasoning_effort: low
