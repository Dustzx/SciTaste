# Development-only structured action backend. GLM reasoning is disabled at the
# machine-action boundary because two immutable v1 trajectories returned text
# that violated JSON mode. Scientific reasoning remains visible in the required
# rationale field and in the multi-turn observation history.
provider: zhipu-direct
base_url: https://open.bigmodel.cn/api/paas/v4
model: glm-5.3-flash
api_key_env: ZAI_API_KEY
live_enabled: true
timeout_seconds: 600
max_retries: 0
max_output_tokens: 8192
pricing_confirmed: false
pricing: null
unpriced_engineering_probe: true
extra_headers: {}
extra_body:
  thinking:
    type: disabled
  do_sample: false
