name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out SciTaste and pinned substrate
        uses: actions/checkout@v7
        with:
          # Native evidence preflights inspect exact ancestor bytes with `git show`.
          # A depth-1 checkout makes those objects falsely appear unavailable.
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install native isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --die-with-parent --unshare-all --new-session \
            --uid 65534 --gid 65534 \
            --ro-bind /usr /usr --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev /bin/true
      - name: Install SciTaste test environment
        run: >-
          python -m pip install
          -c requirements/python312-dev-study.lock
          -e '.[dev,study]'
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Run test suite with coverage
        id: tests
        continue-on-error: true
        run: >-
          python -m pytest --cov=scitaste --cov-report=term-missing
          --junitxml=/tmp/scitaste-pytest-python312.xml
      - name: Publish test failure annotations
        if: steps.tests.outcome == 'failure'
        run: >-
          python .github/scripts/report_pytest_failures.py
          /tmp/scitaste-pytest-python312.xml
      - name: Retain failed test report
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: pytest-python-3.12
          path: /tmp/scitaste-pytest-python312.xml
          if-no-files-found: error
          retention-days: 7
      - name: Run installed CLI smoke test
        if: steps.tests.outcome == 'success'
        run: scitaste run demo --output /tmp/scitaste-demo --seed 7
