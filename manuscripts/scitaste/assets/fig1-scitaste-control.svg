<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">SciTaste turns research experience into scientific decision control</title>
  <desc id="figure-description">High-quality papers, reviews, revisions, and outcomes are abstracted into verified Taste Cases. At each step, the Taste Controller combines current research state, factual knowledge, decision precedent, and budget to rank a closed action set. Bounded workers return typed results, while deterministic admission alone can commit the next research state.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34312c" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65d2e" />
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68715e" />
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11.5px; }
      .micro { font-size: 10.5px; }
      .ink { fill: #24221e; }
      .soft { fill: #666158; }
      .faint { fill: #8a847a; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="20" fill="#fbfaf7" />
  <text x="40" y="35" class="sans label" fill="#a65d2e">SCITASTE · SCIENTIFIC TASTE AS A RESEARCH CONTROL POLICY</text>
  <line x1="40" y1="51" x2="1160" y2="51" stroke="#ded8ce" />

  <g id="taste-formation" data-kind="panel">
    <text x="40" y="78" class="sans label" fill="#8a847a">A · FORM TRANSFERABLE TASTE</text>

    <g id="high-quality-research" data-kind="entity" data-role="source-evidence">
      <rect x="40" y="92" width="212" height="104" rx="10" fill="#fffdf9" stroke="#cfc7bb" />
      <text x="58" y="119" class="serif heading ink">High-quality research</text>
      <g class="sans micro soft">
        <rect x="58" y="135" width="71" height="24" rx="12" fill="#f0ece5" /><text x="93.5" y="151" text-anchor="middle">papers</text>
        <rect x="136" y="135" width="82" height="24" rx="12" fill="#f0ece5" /><text x="177" y="151" text-anchor="middle">reviews</text>
        <rect x="58" y="165" width="83" height="24" rx="12" fill="#f0ece5" /><text x="99.5" y="181" text-anchor="middle">revisions</text>
        <rect x="148" y="165" width="70" height="24" rx="12" fill="#f0ece5" /><text x="183" y="181" text-anchor="middle">outcomes</text>
      </g>
    </g>

    <path d="M252 144 H292" fill="none" stroke="#34312c" stroke-width="1.7" marker-end="url(#arrow-ink)" />

    <g id="taste-abstraction" data-kind="entity" data-role="abstraction">
      <rect x="300" y="92" width="214" height="104" rx="10" fill="#fffdf9" stroke="#cfc7bb" />
      <text x="318" y="119" class="serif heading ink">Abstract decisions</text>
      <text x="318" y="143" class="sans small soft">decision · context · alternatives</text>
      <text x="318" y="162" class="sans small soft">evidence · cost · observed outcome</text>
      <text x="318" y="183" class="sans micro" fill="#a65d2e">not passage imitation</text>
    </g>

    <path d="M514 144 H554" fill="none" stroke="#34312c" stroke-width="1.7" marker-end="url(#arrow-ink)" />

    <g id="taste-library" data-kind="entity" data-role="decision-precedent">
      <rect x="562" y="92" width="238" height="104" rx="10" fill="#2b2925" stroke="#2b2925" />
      <text x="582" y="119" class="sans micro" fill="#d9c7b7">PROVENANCE + TRANSFER GATES</text>
      <text x="582" y="148" class="serif heading" fill="#ffffff">Verified Taste Cases</text>
      <text x="582" y="171" class="sans small" fill="#d7d2ca">decision precedents, not facts</text>
      <circle cx="771" cy="116" r="8" fill="#a65d2e" />
      <path d="M767 116 L770 119 L776 111" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g id="knowledge-taste-distinction" data-kind="annotation">
      <rect x="848" y="92" width="312" height="104" rx="10" fill="#f3efe7" stroke="#ded8ce" />
      <text x="868" y="119" class="sans label" fill="#68715e">KNOWLEDGE ≠ TASTE</text>
      <text x="868" y="144" class="sans body ink">Knowledge supplies factual context.</text>
      <text x="868" y="166" class="sans body ink">Taste supplies decision precedent.</text>
      <text x="868" y="185" class="sans micro soft">Retrieval transports both; it is not the judgment.</text>
    </g>
  </g>

  <line x1="40" y1="222" x2="1160" y2="222" stroke="#ded8ce" />
  <text x="40" y="250" class="sans label" fill="#8a847a">B · CONTROL THE NEXT RESEARCH STEP</text>

  <g id="research-state" data-kind="entity" data-role="canonical-state">
    <rect x="40" y="271" width="250" height="221" rx="12" fill="#fffdf9" stroke="#9ea6aa" stroke-width="1.4" />
    <rect x="40" y="271" width="250" height="48" rx="12" fill="#edf1f2" />
    <path d="M40 307 H290 V319 H40 Z" fill="#edf1f2" />
    <text x="58" y="301" class="serif heading ink">ResearchState S_t</text>
    <text x="58" y="342" class="sans small soft">problem · hypothesis · observations</text>
    <text x="58" y="363" class="sans small soft">claims · evidence · review obligations</text>
    <text x="58" y="384" class="sans small soft">resource ledger · decision history</text>
    <line x1="58" y1="402" x2="272" y2="402" stroke="#ded8ce" />
    <text x="58" y="425" class="sans micro" fill="#68715e">CLOSED, FEASIBLE ACTION SET A(S_t)</text>
    <g class="sans micro ink">
      <rect x="58" y="438" width="48" height="24" rx="12" fill="#f0ece5" /><text x="82" y="454" text-anchor="middle">probe</text>
      <rect x="112" y="438" width="78" height="24" rx="12" fill="#f0ece5" /><text x="151" y="454" text-anchor="middle">reformulate</text>
      <rect x="196" y="438" width="76" height="24" rx="12" fill="#f0ece5" /><text x="234" y="454" text-anchor="middle">experiment</text>
      <text x="58" y="482" class="sans micro soft">write · review · pivot · stop · …</text>
    </g>
  </g>

  <path d="M290 381 H350" fill="none" stroke="#34312c" stroke-width="1.8" marker-end="url(#arrow-ink)" />
  <text x="320" y="370" text-anchor="middle" class="sans micro soft">candidate</text>
  <text x="320" y="382" text-anchor="middle" class="sans micro soft">actions</text>

  <g id="taste-controller" data-kind="entity" data-role="decision-owner">
    <rect x="358" y="271" width="348" height="221" rx="12" fill="#fffdf9" stroke="#a65d2e" stroke-width="2" />
    <rect x="358" y="271" width="348" height="50" rx="12" fill="#a65d2e" />
    <path d="M358 307 H706 V321 H358 Z" fill="#a65d2e" />
    <text x="380" y="302" class="serif heading" fill="#ffffff">Taste Controller</text>
    <text x="680" y="300" text-anchor="end" class="sans micro" fill="#f6e8dc">DECISION OWNER</text>

    <g class="sans micro">
      <rect x="380" y="338" width="142" height="27" rx="13.5" fill="#edf1f2" />
      <text x="451" y="356" text-anchor="middle" fill="#465158">Knowledge K_t · facts</text>
      <rect x="532" y="338" width="152" height="27" rx="13.5" fill="#f4e5d7" />
      <text x="608" y="356" text-anchor="middle" fill="#8b4d27">Taste T_t · precedents</text>
    </g>

    <text x="380" y="392" class="sans small soft">Rank actions by</text>
    <g class="sans micro ink">
      <text x="380" y="416">scientific value</text><circle cx="477" cy="412" r="2.5" fill="#a65d2e" />
      <text x="490" y="416">information gain</text><circle cx="584" cy="412" r="2.5" fill="#a65d2e" />
      <text x="597" y="416">evidence fit</text>
      <text x="380" y="437">uncertainty</text><circle cx="450" cy="433" r="2.5" fill="#a65d2e" />
      <text x="463" y="437">risk</text><circle cx="491" cy="433" r="2.5" fill="#a65d2e" />
      <text x="504" y="437">cost</text><circle cx="533" cy="433" r="2.5" fill="#a65d2e" />
      <text x="546" y="437">remaining budget B_t</text>
    </g>
    <rect x="380" y="451" width="304" height="26" rx="5" fill="#f7f3ed" />
    <text x="532" y="469" text-anchor="middle" class="serif body ink">a_t = arg max U(a | S_t, K_t, T_t, B_t)</text>
  </g>

  <path d="M681 196 V258 H622 V271" fill="none" stroke="#a65d2e" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-accent)" />
  <text x="696" y="245" class="sans micro" fill="#a65d2e">stage-aware precedent</text>

  <path d="M706 337 H774" fill="none" stroke="#a65d2e" stroke-width="2" marker-end="url(#arrow-accent)" />
  <text x="740" y="325" text-anchor="middle" class="sans micro" fill="#a65d2e">select one</text>
  <text x="740" y="337" text-anchor="middle" class="sans micro" fill="#a65d2e">action</text>

  <g id="bounded-work" data-kind="entity" data-role="proposal-and-execution">
    <rect x="782" y="271" width="190" height="91" rx="11" fill="#fffdf9" stroke="#cfc7bb" />
    <text x="800" y="296" class="sans label" fill="#8a847a">BOUNDED WORK</text>
    <text x="800" y="322" class="serif heading ink">Worker / model</text>
    <text x="800" y="344" class="sans micro soft">native · API · external adapter</text>
  </g>

  <path d="M877 362 V388" fill="none" stroke="#34312c" stroke-width="1.7" marker-end="url(#arrow-ink)" />

  <g id="typed-result" data-kind="entity" data-role="unadmitted-result">
    <rect x="782" y="396" width="190" height="96" rx="11" fill="#fffdf9" stroke="#cfc7bb" />
    <text x="800" y="421" class="sans label" fill="#8a847a">PROPOSAL, NOT STATE</text>
    <text x="800" y="447" class="serif heading ink">Typed result R_t</text>
    <text x="800" y="470" class="sans micro soft">evidence · provenance · cost</text>
  </g>

  <path d="M972 444 H1012" fill="none" stroke="#34312c" stroke-width="1.7" marker-end="url(#arrow-ink)" />

  <g id="admission-gate" data-kind="entity" data-role="transition-authority">
    <rect x="1020" y="335" width="140" height="114" rx="12" fill="#e9ede6" stroke="#68715e" stroke-width="1.8" />
    <text x="1090" y="363" text-anchor="middle" class="sans label" fill="#68715e">TRANSITION</text>
    <text x="1090" y="387" text-anchor="middle" class="serif heading ink">Admission</text>
    <text x="1090" y="407" text-anchor="middle" class="sans micro soft">schema · identity</text>
    <text x="1090" y="423" text-anchor="middle" class="sans micro soft">evidence · budget</text>
    <path d="M1077 435 L1086 443 L1104 425" fill="none" stroke="#68715e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <path d="M1090 335 V228 H681 V196" fill="none" stroke="#68715e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-sage)" />
  <rect x="812" y="216" width="216" height="20" rx="10" fill="#fbfaf7" />
  <text x="920" y="230" text-anchor="middle" class="sans micro" fill="#68715e">verified outcomes may become new cases</text>

  <g id="rejected-result" data-kind="annotation">
    <path d="M1125 449 V479" fill="none" stroke="#9a948a" stroke-width="1.4" marker-end="url(#arrow-ink)" />
    <rect x="1020" y="486" width="140" height="37" rx="7" fill="#f3efe7" stroke="#ded8ce" />
    <text x="1090" y="501" text-anchor="middle" class="sans micro soft">reject → failure record</text>
    <text x="1090" y="514" text-anchor="middle" class="sans micro soft">no state transition</text>
  </g>

  <path d="M1060 449 V553 H165 V492" fill="none" stroke="#68715e" stroke-width="2" marker-end="url(#arrow-sage)" />
  <rect x="385" y="541" width="470" height="24" rx="12" fill="#fbfaf7" />
  <text x="620" y="557" text-anchor="middle" class="sans small" fill="#68715e">accept → commit S_t+1 · preserve evidence and decision lineage</text>

  <line x1="40" y1="585" x2="1160" y2="585" stroke="#ded8ce" />
  <g id="authority-legend" data-kind="legend" class="sans small">
    <circle cx="48" cy="607" r="5" fill="#a65d2e" /><text x="62" y="611" class="ink">Taste selects what is worth doing next</text>
    <circle cx="385" cy="607" r="5" fill="#cfc7bb" /><text x="399" y="611" class="ink">Models and executors propose or perform bounded work</text>
    <circle cx="836" cy="607" r="5" fill="#68715e" /><text x="850" y="611" class="ink">Deterministic gates own state transitions</text>
  </g>
</svg>
