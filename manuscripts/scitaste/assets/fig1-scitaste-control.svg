<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">SciTaste learns outcome-calibrated scientific action values</title>
  <desc id="desc">Matched action continuations provide downstream utility supervision. An outcome-hidden grounded state is converted into traceable action features, a task-disjoint ridge policy scores feasible actions, and the selected action controls the native research loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3c3b37"/></marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ad5a27"/></marker>
    <style>
      .title{font:700 31px 'Lato',Arial,sans-serif;fill:#252420}.section{font:700 23px 'Lato',Arial,sans-serif;fill:#726f66;letter-spacing:1px}.boxTitle{font:700 26px 'Lato',Arial,sans-serif;fill:#252420}.body{font:400 20px 'Lato',Arial,sans-serif;fill:#4b4943}.small{font:400 18px 'Lato',Arial,sans-serif;fill:#625f57}.accent{font:700 20px 'Lato',Arial,sans-serif;fill:#a95526}.whiteTitle{font:700 26px 'Lato',Arial,sans-serif;fill:#fff}.whiteBody{font:400 19px 'Lato',Arial,sans-serif;fill:#fff8f2}.box{fill:#fbfaf7;stroke:#cbc5b9;stroke-width:2}.source{fill:#f4f0e9;stroke:#c8c0b3;stroke-width:2}.target{fill:#eef3f4;stroke:#98a7aa;stroke-width:2}.method{fill:#fff7f0;stroke:#ad5a27;stroke-width:3}.policy{fill:#ad5a27;stroke:#8e431c;stroke-width:2}.system{fill:#eff2eb;stroke:#6d7762;stroke-width:2}.flow{fill:none;stroke:#3c3b37;stroke-width:3;marker-end:url(#arrow)}.accentFlow{fill:none;stroke:#ad5a27;stroke-width:3;marker-end:url(#arrowAccent)}.feedback{fill:none;stroke:#6d7762;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="1598" height="758" rx="22" fill="#fffdf9" stroke="#e3ded4" stroke-width="2"/>
  <text x="55" y="55" class="title">SCITASTE: LEARN WHICH SCIENTIFIC MOVE PRODUCES BETTER EVIDENCE</text>
  <line x1="55" y1="76" x2="1545" y2="76" stroke="#d8d1c5" stroke-width="2"/>

  <text x="55" y="116" class="section">A · LEARN FROM MATCHED CONTINUATIONS ON DEVELOPMENT TASKS</text>
  <rect x="55" y="140" width="325" height="170" rx="18" class="source"/>
  <text x="82" y="180" class="boxTitle">Freeze a research prefix</text>
  <text x="82" y="218" class="body">state S + feasible menu A</text>
  <text x="82" y="250" class="body">same tools, budget, scorer</text>
  <text x="82" y="282" class="small">task-cluster provenance bound</text>
  <path d="M380 225 H425" class="flow"/>

  <rect x="430" y="140" width="335" height="170" rx="18" class="box"/>
  <text x="457" y="180" class="boxTitle">Execute every action</text>
  <text x="457" y="218" class="body">a₁ → Y(a₁)   a₂ → Y(a₂)</text>
  <text x="457" y="250" class="body">a₃ → Y(a₃), paired seeds</text>
  <text x="457" y="282" class="small">failures retained at utility zero</text>
  <path d="M765 225 H810" class="flow"/>

  <rect x="815" y="140" width="355" height="170" rx="18" class="method"/>
  <text x="842" y="180" class="boxTitle">Ground traceable features</text>
  <text x="842" y="218" class="body">situation axes + exact anchors</text>
  <text x="842" y="250" class="body">named numerics + observations</text>
  <text x="842" y="282" class="small">action interactions · no target outcome</text>
  <path d="M1170 225 H1215" class="accentFlow"/>

  <rect x="1220" y="140" width="325" height="170" rx="18" class="policy"/>
  <text x="1247" y="180" class="whiteTitle">Fit and freeze Q̂(S,a)</text>
  <text x="1247" y="218" class="whiteBody">nested task-cluster holdout</text>
  <text x="1247" y="250" class="whiteBody">sparse-feature ridge policy</text>
  <text x="1247" y="282" class="whiteBody">content-hashed before test</text>

  <text x="55" y="366" class="section">B · SELECT ON A TASK-DISJOINT OUTCOME-HIDDEN STATE</text>
  <rect x="55" y="393" width="285" height="185" rx="18" class="target"/>
  <text x="82" y="435" class="boxTitle">Target state S_t</text>
  <text x="82" y="473" class="body">visible evidence + budget</text>
  <text x="82" y="505" class="body">frozen feasible menu A_t</text>
  <text x="82" y="543" class="small">branch outcomes unavailable</text>
  <path d="M340 485 H390" class="flow"/>

  <rect x="395" y="393" width="345" height="185" rx="18" class="method"/>
  <text x="422" y="435" class="boxTitle">Score feasible actions</text>
  <text x="422" y="473" class="body">x(S_t,a) → Q̂(S_t,a)</text>
  <text x="422" y="505" class="body">canonical deterministic arg max</text>
  <text x="422" y="543" class="small">state hash · model hash · all scores</text>
  <path d="M740 485 H790" class="accentFlow"/>

  <rect x="795" y="393" width="285" height="185" rx="18" class="policy"/>
  <text x="822" y="435" class="whiteTitle">Taste decision</text>
  <text x="822" y="474" class="whiteBody">recommend one registered</text>
  <text x="822" y="506" class="whiteBody">scientific action</text>
  <text x="822" y="541" class="whiteBody">typed control packet</text>
  <path d="M1080 485 H1130" class="accentFlow"/>

  <rect x="1135" y="393" width="410" height="185" rx="18" class="system"/>
  <text x="1162" y="435" class="boxTitle">SciTaste Native research loop</text>
  <text x="1162" y="473" class="body">execute → evidence → paper → review</text>
  <text x="1162" y="505" class="body">same model · tools · task · budget</text>
  <text x="1162" y="543" class="small">Base omits only the Taste recommendation</text>

  <path d="M1480 578 V610 H1570 V105 H1385 V135" class="feedback"/>
  <text x="1140" y="610" class="small">sealed outcomes train only later task-disjoint policies</text>

  <rect x="55" y="626" width="1035" height="78" rx="15" fill="#f7f3ec" stroke="#d5cdbf" stroke-width="2"/>
  <text x="82" y="660" class="accent">TWO ESTIMANDS</text>
  <text x="270" y="660" class="body">diagnostic: action regret</text>
  <text x="590" y="660" class="body">system: scorer-owned research progress</text>
  <text x="270" y="688" class="small">A changed action must mediate any claimed downstream improvement.</text>
</svg>
