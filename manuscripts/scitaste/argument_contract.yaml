central_question: Does an outcome-grounded, selectively transferring Scientific Taste policy improve the decisions and final research outcomes of a complete autonomous-research system under matched resources?
central_answer: SciTaste defines and implements the policy and complete native system; the working draft reserves, but does not yet populate, the formal complete-system, external-validity, causal-ablation, and outcome-learning results required for an improvement claim.
