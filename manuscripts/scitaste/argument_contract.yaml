central_question: Can outcome-attributed scientific decisions support a bounded, uncertainty-aware lifecycle policy for autonomous research, and does that policy improve held-out objective progress?
central_answer: SciTaste implements the decision, attribution, estimation, and abstention operators on authored fixtures, while natural-case proxy validity and held-out objective-progress effects remain open prospective questions.
