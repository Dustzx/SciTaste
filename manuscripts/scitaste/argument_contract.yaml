central_question: Can a research framework keep scientific action selection, evidence admission, and publication provenance explicit while delegating bounded work to models and executors?
central_answer: SciTaste provides that auditable control substrate in the implemented and registered settings; whether Taste-guided control improves research yield remains a separate pending effectiveness question.
