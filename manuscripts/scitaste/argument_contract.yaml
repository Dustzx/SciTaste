central_question: Under matched information and resource budgets, does explicit scientific taste improve the scientific value and evidence validity of autonomous research?
central_answer: SciTaste implements explicit precedent-informed scientific decisions over persistent research state, but the headline improvement claim remains unestablished until the registered external package-preference, objective-progress, ablation, and independent-review evidence is complete.
