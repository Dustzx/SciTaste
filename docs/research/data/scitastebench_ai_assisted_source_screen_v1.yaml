release_governance:
  policy_locator: >-
    configs/evaluation/human_review/scitastebench_source_release_governance_v2.yaml
  file_sha256: 5f56d50e5eb38854bade71db6e29f0656c4468e6b67fedd7b559b4718e4db8e0
  policy_sha256: 0a6e6697622cdbb275ad5a6cb4258e310374d79c75a1aacd454c09e8e0f8ef03
  internal_ai_screening_allowed: true
  public_release_authorized: false
  release_modes:
    aries-taste-source-review-v1: controlled-internal-only
    f1000-multidomain-taste-source-review-v1: controlled-internal-only
  interpretation: >-
    Source blindness is not de-identification. ARIES currently binds a database
    license rather than per-item paper or review rights, while F1000 per-item
    license and attribution evidence was not preserved in the frozen campaign.
    Both populations may be screened internally but may not be released.
scaling_gate:
  ready_for_scaled_ai_screening: false
  blocker_codes:
    - ai-invocation-reproducibility-bindings-incomplete
    - exact-ai-model-identities-unbound
    - scientific-rubric-agreement-below-calibration-threshold
  public_release_blocker_codes:
    - source-populations-controlled-internal-only
authority:
  screening_method: interactive-codex-subagents
  exact_model_identity_bound: false
  invocation_ids_distinct: true
  reproducibility_ready: false
  not_human_review: true
  not_ethics_review: true
  formal_evidence_eligible: false
  benchmark_admission_authorized: false
  human_review_replacement_allowed: false
  model_calls_performed: true
claim_boundary: >-
  The screen diagnoses workflow and policy ambiguity. It cannot satisfy the two
  independent human scientific labels, privacy review, conflicts screening,
  adjudication, or judge-validation requirements of formal SciTasteBench.
