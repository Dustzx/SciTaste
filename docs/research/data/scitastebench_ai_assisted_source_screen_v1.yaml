    file_sha256: 419c4d30b0b893d3b8a0d59a8ed73b8d1d9723cd6c28f2a4da8a658687496a3b
  - role: privacy-agent
    locator: >-
      outputs/projects/scitaste-self-development/evaluations/ai-assisted-source-screen-v1/privacy.json
    file_sha256: 5ba7399de150794630547cb90c8e8d564d4d14497984f8619adfcf7e0ae5afbc
