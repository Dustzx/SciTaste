purpose: >-
  Acquire the smallest official ARIES slice that preserves a real public review,
  its aligned paper edits, source/target paper text, split identity, and the
  released human alignment subset. These bytes are natural Scientific Taste case
  candidates; observed edits and released alignment labels are context, not
  scientific-quality gold labels.
claim_boundary: >-
  Download and byte identity do not admit a benchmark case, a Taste precedent,
  a preferred action, or an experiment result. Source-group deduplication,
  identifier removal, two independent conflict-cleared scientific-value reviews,
  case/precedent disjointness, and formal split freezing remain required.
population_role: natural-review-to-edit-candidate-source
