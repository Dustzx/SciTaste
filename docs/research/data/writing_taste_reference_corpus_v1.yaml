schema_version: "1.0"
study_id: writing-taste-reference-study-v1
cutoff_date: "2026-09-09"
status: candidate_reference_library
normative_status: not_yet_promoted_to_writing_taste_rules

selection:
  positive_population:
    description: >-
      Complete set of papers recognized as Outstanding Paper or Honorable
      Mention by the official ICLR award announcements from 2023 through 2026.
    count: 29
    years: [2023, 2024, 2025, 2026]
    award_pages:
      - https://blog.iclr.cc/2023/03/21/announcing-the-iclr-2023-outstanding-paper-award-recipients/
      - https://blog.iclr.cc/2024/05/06/iclr-2024-outstanding-paper-awards/
      - https://blog.iclr.cc/2025/04/22/announcing-the-outstanding-paper-awards-at-iclr-2025/
      - https://blog.iclr.cc/2026/04/23/announcing-the-iclr-2026-outstanding-papers/
  inclusion_rule: >-
    Include every officially recognized paper in the four award pages; do not
    select papers according to whether they support a preferred writing rule.
  negative_population:
    status: pending
    requirement: >-
      Accepted non-award, rejected, and deliberately perturbed papers must be
      added before calibrating a classifier or claiming predictive validity.

extraction:
  acquisition_date: "2026-09-09"
  review_depth: structural_targeted_reading
  manual_fields:
    - archetype
    - evidence_arc
    - primary_carriers
    - boundary_note
  automated_fields:
    - pdf_pages
    - unique_figure_labels
    - unique_table_labels
    - unique_algorithm_labels
  automated_method: >-
    PDFs were converted with pdftotext -layout. Counts are the number of unique
    Arabic-numbered Figure, Table, and Algorithm labels found in extracted text.
  counting_limitations:
    - Counts include appendices and do not measure visual quality.
    - Unnumbered panels, theorem environments, and extraction failures are omitted.
    - A count is a descriptive corpus observation, never a minimum quota.
  copyright_policy: >-
    Store bibliographic locators, measurements, and original paraphrased
    observations only. Do not vendor PDFs or reproduce source prose.

