candidate_principles:
  - principle_id: WT-R01
    name: one_scientific_center
    evidence_level: recurrent_cross_archetype
    statement: >-
      Give the paper one central answer; secondary contributions must support,
      extend, operationalize, or bound that answer.
    diagnostic_questions:
      - Can a reviewer state the main answer in one sentence?
      - Does every claimed contribution have an explicit relation to that answer?
    supporting_references: [2023-emergence-maps, 2024-never-train-scratch, 2024-vit-registers, 2025-safety-alignment, 2026-multiturn-lost]
    triangulating_projects: [oss-anti-defensive-writing, oss-paper-writing-guide]

  - principle_id: WT-R02
    name: promise_delivery_contract
    evidence_level: recurrent_cross_archetype
    statement: >-
      The title, abstract, and introduction promise a question and answer that
      the results, proofs, and conclusion visibly deliver at the same scope.
    diagnostic_questions:
      - Is each headline promise linked to a primary evidence carrier?
      - Does the conclusion answer the introduced question without expanding scope?
    supporting_references: [2023-vtm, 2023-gnn-biconnectivity, 2024-contamination, 2025-data-shapley, 2026-transformers-succinct]
    triangulating_projects: [oss-academic-paper-writing, oss-paper-writing-guide]

  - principle_id: WT-R03
    name: question_driven_evidence_progression
    evidence_level: recurrent_cross_archetype
    statement: >-
      Organize empirical results by the scientific questions they answer, not
      by run chronology, implementation milestones, or artifact inventory.
    diagnostic_questions:
      - Does each result subsection state the uncertainty it resolves?
      - Would changing the experiment order change the argument order?
    supporting_references: [2023-emergence-maps, 2024-never-train-scratch, 2024-abrupt-learning, 2025-learning-dynamics, 2026-multiturn-lost]
    triangulating_projects: [oss-anti-defensive-writing, oss-paper-writing-guide]

  - principle_id: WT-R04
    name: claim_has_primary_carrier
    evidence_level: recurrent_cross_archetype
    statement: >-
      Every important claim needs a named primary carrier: theorem, controlled
      comparison, table, curve, qualitative panel, audit, or real-world test.
    diagnostic_questions:
      - What artifact would a reviewer inspect first to verify the claim?
      - Is prose interpreting that artifact rather than substituting for it?
    supporting_references: [2023-dreamfusion, 2024-protein-walk-jump, 2024-contamination, 2025-alphaedit, 2026-polar-express]
    triangulating_projects: [oss-academic-paper-writing, oss-releasing-research-code]

  - principle_id: WT-R05
    name: type_conditioned_visual_completeness
    evidence_level: strong_descriptive_with_counterexample
    statement: >-
      Require the visual or formal carriers demanded by the paper's claims; do
      not impose a universal count of figures, tables, experiments, or ablations.
    diagnostic_questions:
      - Which relationships or effects are materially harder to verify in prose?
      - Is the carrier appropriate for empirical, systems, discovery, or theory work?
    supporting_references: [2024-amortized-inference, 2024-vit-registers, 2025-sam2, 2026-multiturn-lost]
    boundary_references: [2024-causal-world-models, 2026-transformers-succinct]
    triangulating_projects: [oss-academic-paper-writing, oss-embodied-ai-paper-writer]

  - principle_id: WT-R06
    name: diagnosis_mechanism_intervention_ladder
    evidence_level: recurrent_discovery_pattern
    statement: >-
      When making a mechanistic claim, establish the phenomenon, discriminate
      explanations, and test an intervention or prediction derived from the mechanism.
    diagnostic_questions:
      - Is the mechanism distinguishable from a descriptive correlation?
      - Does an intervention or novel prediction close the causal story?
    supporting_references: [2023-emergence-maps, 2024-diffusion-generalization, 2024-vit-registers, 2024-abrupt-learning, 2025-learning-dynamics, 2025-safety-alignment]
    triangulating_projects: []

  - principle_id: WT-R07
    name: fair_contest
    evidence_level: recurrent_empirical_pattern
    statement: >-
      A comparative claim must state and match the resources that could explain
      the result, including data, compute, model scale, tuning, and evaluation access.
    diagnostic_questions:
      - Could an unmatched resource explain the claimed advantage?
      - Is the baseline strong under the same information and budget?
    supporting_references: [2023-vtm, 2024-never-train-scratch, 2024-one-video, 2025-alphaedit, 2025-sam2]
    triangulating_projects: [oss-academic-paper-writing]

  - principle_id: WT-R08
    name: stress_the_claim
    evidence_level: recurrent_empirical_pattern
    statement: >-
      Robustness, ablation, sensitivity, scale, and seed analyses are selected
      according to the failure modes of the central claim, not added as a checklist pile.
    diagnostic_questions:
      - What plausible alternative explanation does each analysis eliminate?
      - Which stress test would most likely reverse the conclusion?
    supporting_references: [2023-dreamfusion, 2023-vtm, 2024-unisim, 2024-kv-compression, 2025-safety-alignment, 2025-sam2, 2026-polar-express]
    triangulating_projects: [oss-embodied-ai-paper-writer]

  - principle_id: WT-R09
    name: close_the_world_interface
    evidence_level: recurrent_system_and_application_pattern
    statement: >-
      If a claim crosses from an algorithm into a system or application, include
      evidence at that interface rather than relying only on proxy benchmarks.
    diagnostic_questions:
      - Where does the proposed component touch users, hardware, data, or downstream tasks?
      - Is that interface directly evaluated?
    supporting_references: [2024-unisim, 2024-protein-walk-jump, 2024-kv-compression, 2025-sam2, 2026-polar-express]
    triangulating_projects: [oss-releasing-research-code]

  - principle_id: WT-R10
    name: every_visual_has_argumentative_duty
    evidence_level: recurrent_cross_archetype
    statement: >-
      Each figure or table should make one scientific relation, comparison, or
      boundary easier to verify; decoration and prose duplication do not count.
    diagnostic_questions:
      - Can the visual's intended takeaway be stated in one sentence?
      - Does the surrounding text explain why the pattern matters?
    supporting_references: [2023-dreamfusion, 2024-diffusion-generalization, 2024-never-train-scratch, 2025-faster-cascades, 2025-learning-dynamics]
    triangulating_projects: [oss-anti-defensive-writing, oss-embodied-ai-paper-writer, oss-academic-paper-writing]

  - principle_id: WT-R11
    name: main_text_evidence_first
    evidence_level: recurrent_layout_pattern
    statement: >-
      Put the evidence necessary to believe the headline claim in the main text;
      use appendices for derivation depth, additional settings, and reproducibility detail.
    diagnostic_questions:
      - Can the main claim be assessed without opening the appendix?
      - Does the appendix deepen rather than rescue the central argument?
    supporting_references: [2023-gnn-biconnectivity, 2024-contamination, 2024-flow-matching-geometries, 2025-alphaedit, 2026-multiturn-lost]
    triangulating_projects: [oss-embodied-ai-paper-writer, oss-academic-paper-writing]

  - principle_id: WT-R12
    name: boundaries_visible_once_and_precisely
    evidence_level: recurrent_integrity_pattern
    statement: >-
      Keep limitations that alter validity, scope, safety, or reproducibility,
      but state each precisely where it changes interpretation instead of repeatedly self-negating.
    diagnostic_questions:
      - Would omitting the limitation mislead a reviewer about validity or scope?
      - Is the same caveat repeated where it no longer helps interpretation?
    supporting_references: [2023-dreamfusion, 2024-contamination, 2024-causal-world-models, 2025-safety-alignment, 2026-multiturn-lost]
    triangulating_projects: [oss-anti-defensive-writing, oss-academic-paper-writing]

  - principle_id: WT-R13
    name: theory_uses_a_proof_chain
    evidence_level: recurrent_theory_pattern
    statement: >-
      A theory paper should expose definitions, intuition, main result, proof
      dependencies, consequences, and assumptions as a navigable chain.
    diagnostic_questions:
      - Can the reader see why every formal component is needed before the proof uses it?
      - Are consequences and assumption boundaries separated from the theorem itself?
    supporting_references: [2023-gnn-biconnectivity, 2024-nash-stochastic, 2024-causal-world-models, 2024-beyond-wl, 2026-transformers-succinct, 2026-polar-express]
    triangulating_projects: [oss-paper-writing-guide]

  - principle_id: WT-R14
    name: reproducibility_is_part_of_the_claim
    evidence_level: recurrent_empirical_and_artifact_pattern
    statement: >-
      The paper and repository should expose the data, procedure, settings,
      compute, and evaluation path needed to recreate the principal result.
    diagnostic_questions:
      - Is there a traceable path from headline result to executable evaluation?
      - Are resource and preprocessing choices reported where they affect comparison?
    supporting_references: [2024-never-train-scratch, 2024-protein-walk-jump, 2024-contamination, 2025-data-shapley, 2025-sam2]
    triangulating_projects: [oss-releasing-research-code, oss-academic-paper-writing]

  - principle_id: WT-R15
    name: entry_points_agree
    evidence_level: recurrent_cross_archetype
    statement: >-
      Title, abstract, introduction, first explanatory carrier, headline result,
      and conclusion should expose the same central question, answer, and scope.
    diagnostic_questions:
      - Does skimming only the entry points yield one coherent paper?
      - Do terminology and claim strength remain stable across those surfaces?
    supporting_references: [2023-vtm, 2024-one-video, 2024-vit-registers, 2025-learning-dynamics, 2025-sam2, 2026-multiturn-lost]
    triangulating_projects: [oss-academic-paper-writing, oss-paper-writing-guide]

promotion_gate:
  current_decision: hold
  requirements:
    - Add an accepted non-award comparison sample.
    - Add rejected or deliberately perturbed negative examples with known defects.
    - Obtain independent human annotations for whole-paper coherence and evidence completeness.
    - Measure false positives separately by paper archetype.
    - Convert only validated principles into typed, provenance-bearing Taste Cases.
    - Keep descriptive counts out of submission eligibility gates.
