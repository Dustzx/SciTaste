lenses:
  - lens_id: decision
    symbol: D
    label_en: Decision quality
    label_zh: 决策质量
    question_en: Did the system choose and revise well?
    question_zh: 系统是否作出了高质量选择与修正？
  - lens_id: integrity
    symbol: X
    label_en: Experiment integrity
    label_zh: 实验完整性
    question_en: Did the claimed experiment actually execute?
    question_zh: 被主张的实验是否真实执行并可核验？
  - lens_id: progress
    symbol: P
    label_en: Scientific progress
    label_zh: 科学进展
    question_en: Did an external objective improve?
    question_zh: 外部科学目标是否获得真实提升？
  - lens_id: package
    symbol: W
    label_en: Research package
    label_zh: 研究成品
    question_en: Are evidence, code, and paper jointly strong?
    question_zh: 证据、代码与论文是否共同成立？
  - lens_id: human
    symbol: H
    label_en: Human calibration
    label_zh: 人类校准
    question_en: Is automated judging tied to expert judgment?
    question_zh: 自动评审是否经过专家判断校准？
  - lens_id: cost
    symbol: C
    label_en: Cost and intervention
    label_zh: 成本与干预
    question_en: What resources and human rescue were required?
    question_zh: 消耗了多少资源与人工救援？

