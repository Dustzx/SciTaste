        status: verified
        evidence: >-
          Non-redistributive adapter research is compatible with the pinned
          Apache-2.0 root source subject to separate dependency and service review.
      core_unmodified:
        status: blocked
        evidence: No isolated checkout or unchanged-core attestation has been prepared.
      task_mapping:
        status: blocked
        evidence: >-
          The current quest interface has not been mapped to a frozen SciTaste
          task package with equivalent starting information and success criteria.
      model_mapping:
        status: blocked
        evidence: >-
          Runner-specific model behavior has not been qualified under either a
          matched-frontier or disclosed best-native comparison regime.
      sandbox:
        status: blocked
        evidence: >-
          The current launcher can execute commands, modify files, install
          dependencies, and use external services; its permissive default has
          not passed the SciTaste isolation boundary.
        evidence_url: https://github.com/ResearAI/DeepScientist/tree/b36624417f0c6b8238ec02db37b94d6db2faa5b0
      telemetry:
        status: blocked
        evidence: >-
          Model calls, token classes, cost, commands, retries, wall time, human
          interventions, allocated compute, and active compute are not mapped.
      artifact_mapping:
        status: blocked
        evidence: >-
          Quest, branch, experiment, result, and generated artifact identities
          are not mapped into immutable SciTaste evidence records.
      failure_resume:
        status: blocked
        evidence: >-
          Upstream pause/resume and branch features have not passed exact-cell,
          failure-retention, timeout, retry, and content-addressed resume tests.
      disclosure_acceptance:
        status: not_applicable
        evidence: >-
          No system-specific manuscript disclosure obligation beyond normal
          attribution was identified in the pinned root license.
    notes:
      - >-
        The pinned repository reports package version 1.6.0 and may postdate the
        accepted paper; equivalence to the evaluated ICLR 2026 system is unverified.
      - >-
        The paper's more-than-20,000-GPU-hour campaign is a published scale
        observation, not a resource requirement imposed on SciTaste.
      - No checkout, installation, runner invocation, API call, or experiment occurred.

