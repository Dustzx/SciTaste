        evidence_url: https://github.com/ResearAI/DeepScientist/tree/b36624417f0c6b8238ec02db37b94d6db2faa5b0
      publication_identity:
        status: verified
        evidence: Official ICLR proceedings list DeepScientist at ICLR 2026.
        evidence_url: https://proceedings.iclr.cc/paper_files/paper/2026/hash/4f64494ecc3442f1c9261baa036378bc-Abstract-Conference.html
      code_license:
        status: verified
        evidence: The pinned root Apache-2.0 license is bound by SHA-256 above.
        evidence_url: https://raw.githubusercontent.com/ResearAI/DeepScientist/b36624417f0c6b8238ec02db37b94d6db2faa5b0/LICENSE
