post_acquisition_gate:
  required_checks:
    - every-file-hash-and-byte-count-match-the-acquisition-receipt
    - every-record-parses-as-bounded-json
    - embedded-paper-identity-matches-the-path-arxiv-id
    - no-image-pdf-source-archive-or-model-output-was-transitively-fetched
    - attribution-and-license-fields-are-preserved-in-every-derived-record
    - record-fields-are-classified-before-any-model-visible-projection
    - no-source-group-overlaps-a-held-out-case-or-self-development-evidence
  next_decision: >-
    Either reject the acquired pilot without model use, or publish a new
    content-addressed ingestion-and-human-curation proposal. Download approval
    cannot authorize that later decision.
stopping_rules:
  - stop-the-entire-download-transaction-on-any-redirect-or-host-change
  - stop-before-writing-any-item-that-exceeds-its-per-file-ceiling
  - stop-if-any-destination-exists-or-any-evidence-hash-drifts
  - stop-after-the-sixteen-allowlisted-json-files
  - never-expand-the-scope-by-following-record-links
claim_boundary: >-
  This scope proves only a metadata-first, rights-filtered, diversity-enriched
  acquisition proposal. It contains no source body, Taste principle, human
