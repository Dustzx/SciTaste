training_free_fit:
  task_model_parameter_updates: false
  actual_experiment_execution: true
  active_experiment_design: true
  hypothesis_testing: true
  hidden_objective_available: true
  action_space_allows_taste_to_matter: true
  rationale: >-
    An agent must choose informative interventions, balance exploration against
    exploitation, infer a hidden law, and stop with a falsifiable executable
    hypothesis. GPU or API inference may be used, but no task-model weights are
    trained, so the workload is T0 rather than T1.

scitaste_comparison:
  systems: [scitaste-native, native-base]
  fixed_within_pair:
    - exact-research-agent-model-and-serving-window
    - task-and-counterfactual-law
    - experiment-and-turn-budgets
    - code-tool-availability
    - objective-scorer-and-judge
  treatment: frozen-backbone-outcome-updated-lifecycle-taste-policy
  primary_setting: code-assisted-active-discovery
  scientific_reason: >-
    NewtonBench reports that code assistance can cause a premature transition
    from exploration to exploitation. That failure mode directly tests whether
    SciTaste improves experiment selection and stopping decisions rather than
    merely producing more fluent text.

formal_design_boundary:
  source_qualified: true
  primary_t0_candidate_selected: true
  formal_task_population_frozen: false
  execution_authorized: false
  exact_sample_size_frozen: false
  sample_size_rule: >-
    Run one development-only matched Native/Base variance pilot, then freeze the
    smallest domain-stratified population supported by a paired power analysis;
    do not copy the upstream full factorial merely for experiment count.
  primary_endpoint_candidate: paired-symbolic-accuracy-difference
  supporting_endpoints:
    - paired-rmsle-difference
    - experiments-to-correct-law
    - premature-finalization-rate
    - invalid-action-and-execution-failure-rate
    - api-tokens-wall-time-and-cost
  reporting_rule: >-
    Report task-level paired effects and domain-stratified uncertainty. Never
    pool NewtonBench scores with T1 training outcomes or SciJudgeBench scores.

