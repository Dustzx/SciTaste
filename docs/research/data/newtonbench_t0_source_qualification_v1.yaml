  interpretation: >-
    A scripted research agent exercised the real environment, isolated code
    tool, hidden evaluator, and self-hashed terminal receipt. This establishes
    adapter integration only; the script was given the correct law and cannot
    establish research or Taste effectiveness.

remaining_before_model_development_pair:
  - Materialize a source-identified, current-Idea-bound family policy eligible for the formal Native-effect intervention.
  - Register development and held-out NewtonBench task identities before either matched arm runs.
  - Pin one exact research-agent model/provider window for both arms and a distinct fixed symbolic judge.
  - Freeze the task-specific agent prompt after a task-disjoint schema and tool-use check.
  - Freeze a development-only paired variance pilot; do not inspect formal held-out outcomes.

remaining_before_formal_execution:
  - Freeze the domain-stratified population using the preregistered paired power rule.
  - Bind exact task, toolbox, research-agent, judge, code-runner, policy, Idea, and resource hashes in one protocol.
  - Obtain explicit formal execution authorization after disclosing API/GPU/time/output requirements.

known_validity_limits:
  - >-
    All released tasks are public, so they are not claimed to be secret model-
    pretraining holdouts. Matched within-model treatment effects remain useful,
    while absolute capability claims require this contamination caveat.
  - >-
    The upstream symbolic metric uses an LLM judge. Formal use requires an exact
    judge identity and a blinded adjudication policy; RMSLE is retained as an
    independently executable supporting endpoint.
  - >-
    The upstream API adapter only exposes OpenAI/OpenRouter mappings. SciTaste
    must not modify the pinned checkout and must supply its own Zhipu, DeepSeek,
    or local-model boundary.
  - >-
    A NewtonBench task is a bounded scientific-discovery trajectory, not by
    itself a complete conference paper. SciTaste must still produce an evidence
    report, receive review, revise the conclusion, and separately demonstrate
    full Idea-to-paper behavior in the system-level evaluation.

disposition: primary-t0-candidate-runtime-implemented-formal-not-yet-authorized
claim_boundary: >-
  This record proves exact source acquisition and scientific fit for the T0
  role. It does not prove SciTaste effectiveness, formal split isolation,
  adapter correctness, provider fitness, statistical power, or any benchmark
  result.
