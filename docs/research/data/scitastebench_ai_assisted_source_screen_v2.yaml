schema_version: "1.0"
screen_id: scitastebench-ai-assisted-source-screen-v2
project_id: scitaste-self-development
status: atomic-decision-unit-defect-confirmed
purpose: >-
  Re-run the same fixed twelve-item blind sample with two fresh independent AI
  agents and a stricter decision-family rubric, then decide whether rubric
  clarification alone is sufficient to scale source review.
sample:
  candidate_count: 12
  aries_count: 6
  f1000_count: 6
  identical_to_v1_sample: true
rubric:
  locator: >-
    configs/evaluation/ai_review/scitastebench_scientific_screen_rubric_v2.yaml
  file_sha256: 6b50c10960345c0999122972bbbca4383034cfca9bd2f51c29236a13555d1c19
  central_rule: >-
    Label the scientific decision being changed rather than the rhetorical form
    of its supporting argument.
scientific_screen:
  independent_fresh_agent_count: 2
  completed_assessments: 24
  domain_agreement_count: 12
  primary_decision_family_agreement_count: 9
  transferability_agreement_count: 11
  exact_five_dimension_profile_agreement_count: 3
  interpretation: >-
    The clarified decision-family rule improves domain and family agreement but
    does not calibrate the five quality dimensions. Inspection of disagreements
    shows that some F1000 records contain multiple independently actionable
    scientific and writing decisions in one reviewer report. Treating the whole
    report as one labeled case is therefore an invalid unit of analysis.
