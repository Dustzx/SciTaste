open_questions:
  - question_id: tasks
    label_en: Which official MLR-Bench tasks are executable, source-disjoint, licensed, and feasible under the approved budget?
    label_zh: 哪些 MLR-Bench 官方任务可执行、来源隔离、许可清晰且符合预算？
  - question_id: systems
    label_en: Which external systems can accept an equivalent task package without changing their core methods?
    label_zh: 哪些外部系统能在不修改核心方法的前提下接收等价任务包？
  - question_id: power
    label_en: What pilot variance and failure rate determine tasks, seeds, and confidence intervals?
    label_zh: 预实验的方差与失败率如何决定任务数、种子数和置信区间？
  - question_id: judging
    label_en: How will expert package review be sampled, blinded, calibrated, and adjudicated?
    label_zh: 专家对完整研究包的评审应如何抽样、盲化、校准与仲裁？
  - question_id: models
    label_en: Which matched model and official-configuration sensitivity tracks are affordable and semantically valid?
    label_zh: 哪些匹配模型与官方配置敏感性路线既可负担又语义有效？
