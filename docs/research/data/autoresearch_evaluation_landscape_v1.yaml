stages:
  - stage_id: idea
    label_en: Idea
    label_zh: 选题
  - stage_id: proposal
    label_en: Proposal
    label_zh: 方案
  - stage_id: hypothesis
    label_en: Hypothesis
    label_zh: 假设
  - stage_id: design
    label_en: Design
    label_zh: 设计
  - stage_id: execute
    label_en: Execute
    label_zh: 执行
  - stage_id: interpret
    label_en: Interpret
    label_zh: 解释
  - stage_id: paper
