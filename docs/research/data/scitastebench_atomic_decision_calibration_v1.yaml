  human_preference_claim_supported: false
next_gate: >-
  Create a no-run prospective calibration plan on an unobserved sample. Freeze
  the boundary-overlap metric and thresholds, bind exact model/runtime
  identities, and enforce network isolation before deciding whether a
  deterministic 273-source dual-segmentation plan may execute. Keep any final
  human-effect claim conditional on real expert judgments rather than these
  agent labels.
