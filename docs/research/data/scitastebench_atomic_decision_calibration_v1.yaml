scientific_finding: >-
  A source review is not a defensible default benchmark unit. Seven of twelve
  items received multiple proposed segments from at least one independent agent, and
  one F1000 report yielded more than twenty actionable decisions per pass.
  SciTasteBench construction must therefore operate on atomic decision spans
  before quality, transferability, abstraction, or outcome-credit assessment.
