decision: veto
blocking_findings:
  - code: zero-decision-item-forced-positive
    affected_review_item_ids: [item-daa41e81715a2aca2bc88923]
    finding: >-
      The review contains praise, future-value language, and a standard checklist
      but no atomic requested change under the frozen rubric. The output contract
      nevertheless requires at least one segment, so execution would force a false
      positive. cannot-assess is not a valid no-decision placeholder.
    required_change: >-
      Allow an empty segment list and require a bounded no-decision rationale when,
      and only when, the list is empty.
  - code: shared-context-conflicts-with-single-nonoverlap-range
    affected_review_item_ids: [item-4a4927ef298c981cdfc64ee4]
    affected_unit_window: u0259-u0292
    finding: >-
      Several independent requests share one FFT context. A single continuous,
      globally non-overlapping range per decision cannot preserve atomicity,
      intelligibility, and exact evidence at the same time.
    required_change: >-
      Separate an ordered non-overlapping decision-trigger range from zero or more
      context ranges that may be shared across decisions.
  - code: source-group-independence-not-enforced
    finding: >-
      Item-level exclusion is insufficient for cluster-correlated review records.
      The sample contains 22 distinct source groups across 24 items, includes two
      within-sample repeated groups, and reuses source groups exposed in earlier
      calibration samples.
    required_change: >-
      Select and replay a new sample at source-group level, bind the private-map
      receipt without exposing it to segmenters, and report group-aware uncertainty.
  - code: semantic-anonymity-overclaimed
    finding: >-
      Structured identifiers are pseudonymized, but review text may itself contain
      author names, paper titles, or public URLs. Parametric recognition is not
      ruled out, so the material is not semantically anonymous.
    required_change: >-
      Describe the input as structurally pseudonymized and preserve the explicit
      limitation on semantic identity leakage.
scientific_limits:
  - Same-model A/B/C estimates repeated-invocation consistency, not external validity.
  - Adjudicator self-report of zero residual risk cannot prove segmentation completeness.
  - AI-only review cannot be reported as human, expert, or inter-annotator agreement.
  - The protocol lacks a frozen source-group bootstrap or cluster-aware interval.
passed_checks:
  - A and B receive identical items within each shard.
  - Evidence-unit identifiers are continuous and reconstruct exact source slices.
  - No structured outcomes, private-map fields, or peer outputs appear in the pack.
  - Ordinary single requests and non-shared multi-request cases are representable.
