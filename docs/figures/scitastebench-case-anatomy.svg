<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy and controls of one SciTasteBench boundary pair</title>
  <desc id="desc">A publication-scale schematic of invariant scientific context, one changed boundary fact, reversed action utility, a boundary-only shortcut control, and formal release gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.blue{fill:#eaf2ff;stroke:#3973c4;stroke-width:2}.orange{fill:#fff2e8;stroke:#cc6f35;stroke-width:2}.green{fill:#eaf8f1;stroke:#2e8a65;stroke-width:2}.purple{fill:#f2edff;stroke:#7557ae;stroke-width:2}.red{fill:#fff0f0;stroke:#b84b4b;stroke-width:2}.title{font:700 34px Arial,sans-serif;fill:#172033}.head{font:700 25px Arial,sans-serif;fill:#172033}.body{font:400 22px Arial,sans-serif;fill:#334155}.small{font:700 21px Arial,sans-serif;fill:#52647b}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="720"/>
  <text class="title" x="40" y="50">One pair isolates a fact × scientific-context interaction</text>

  <rect class="panel" x="40" y="82" width="420" height="540" rx="16"/>
  <text class="head" x="68" y="122">A  Freeze the decision</text>
  <rect class="blue" x="70" y="150" width="360" height="190" rx="12"/>
  <text class="small" x="94" y="186">INVARIANT CONTEXT</text>
  <text class="body" x="94" y="226">I₁  competing hypotheses</text>
  <text class="body" x="94" y="262">I₂  diagnostic measurement model</text>
  <text class="body" x="94" y="298">I₃  budget and feasible actions</text>
  <path class="arrow" d="M250 342 V380"/>
  <rect class="green" x="70" y="382" width="360" height="190" rx="12"/>
  <text class="small" x="94" y="418">OUTCOME FIREWALL</text>
  <text class="body" x="94" y="458">source and twin fixed first</text>
  <text class="body" x="94" y="494">later outcome remains hidden</text>
  <text class="body" x="94" y="530">one source group → one unit</text>

  <rect class="panel" x="490" y="82" width="450" height="540" rx="16"/>
  <text class="head" x="518" y="122">B  Change exactly one fact</text>
  <rect class="blue" x="520" y="150" width="175" height="180" rx="12"/>
  <text class="small" x="542" y="186">BASE</text>
  <text class="body" x="542" y="226">I₁, I₂, I₃</text>
  <text class="body" x="542" y="264">b = 0</text>
  <text class="body" x="542" y="302">u(A) &gt; u(B)</text>
  <rect class="orange" x="735" y="150" width="175" height="180" rx="12"/>
  <text class="small" x="757" y="186">TWIN</text>
  <text class="body" x="757" y="226">I₁, I₂, I₃</text>
  <text class="body" x="757" y="264">b = 1</text>
  <text class="body" x="757" y="302">u(B) &gt; u(A)</text>
  <path class="dash" d="M608 332 V370 H823 V332"/>
  <rect class="purple" x="520" y="376" width="390" height="156" rx="12"/>
  <text class="small" x="542" y="412">VALID PAIR</text>
  <text class="body" x="542" y="450">single atomic fact; stable actions</text>
  <text class="body" x="542" y="486">preference flips only with I₁–I₃</text>
  <text class="body" x="542" y="522">ties produce abstention</text>
  <text class="small" x="520" y="578">Unit = the pair, never two prompts</text>

  <rect class="panel" x="970" y="82" width="390" height="540" rx="16"/>
  <text class="head" x="998" y="122">C  Reject shortcut labels</text>
  <rect class="red" x="1000" y="150" width="330" height="150" rx="12"/>
  <text class="small" x="1022" y="186">BOUNDARY-ONLY CONTROL</text>
  <text class="body" x="1022" y="226">sees actions + b</text>
  <text class="body" x="1022" y="262">must be chance / abstain</text>
  <path class="arrow" d="M1165 302 V338"/>
  <rect class="green" x="1000" y="340" width="330" height="208" rx="12"/>
  <text class="small" x="1022" y="376">FULL-CONTEXT REVIEW</text>
  <text class="body" x="1022" y="416">must cite ≥2 invariant facts</text>
  <text class="body" x="1022" y="452">two blind reviews retained</text>
  <text class="body" x="1022" y="488">utilities robust to weights</text>
  <text class="body" x="1022" y="524">contradictions rejected</text>
  <text class="small" x="1000" y="586">No post-review repair</text>

  <text class="small" x="40" y="668">Formal release: provenance + rights + raw judgments + disagreement + frozen split + scorer + datasheet</text>
  <text class="body" x="40" y="702">The 30-pair kill test checks construct feasibility; it is not a method result.</text>
</svg>
