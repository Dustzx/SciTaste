<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">SciTasteBench study design</title>
  <desc id="desc">Three scientific decision axes, their six operational contexts, three causal tests, and external autonomous-research validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#40516a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px Inter,Arial,sans-serif;fill:#172238}.sub{font:400 15px Inter,Arial,sans-serif;fill:#56657b}.head{font:700 17px Inter,Arial,sans-serif;fill:#172238}.axis{font:700 15px Inter,Arial,sans-serif;fill:#172238}.body{font:400 13px Inter,Arial,sans-serif;fill:#485970}.small{font:600 12px Inter,Arial,sans-serif;fill:#65748a;letter-spacing:.35px}.row{fill:#fff;stroke:#cad2df;stroke-width:1.3}.source{fill:#eaf2ff;stroke:#4f7dc9;stroke-width:1.8}.decision{fill:#eaf8f1;stroke:#3e9470;stroke-width:1.8}.learning{fill:#fff4df;stroke:#d99a37;stroke-width:1.8}.external{fill:#f3edff;stroke:#8061b5;stroke-width:1.8}.gate{fill:#fff;stroke:#40516a;stroke-width:2}.arrow{stroke:#40516a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1500" height="850"/>
  <text class="title" x="55" y="54">SciTasteBench: where scientific taste should change a decision</text>
  <text class="sub" x="55" y="82">One source group contributes one outcome-hidden fork; source, target, and formal test groups never overlap.</text>

  <text class="head" x="55" y="130">Three decision axes · six coverage tags</text>
  <rect class="row" x="55" y="150" rx="10" width="225" height="112"/>
  <text class="axis" x="75" y="178">DIRECTION</text>
  <text class="body" x="75" y="207">Problem value</text>
  <text class="body" x="75" y="233">Hypothesis &amp; falsifiability</text>
  <rect class="row" x="55" y="276" rx="10" width="225" height="112"/>
  <text class="axis" x="75" y="304">INFORMATION</text>
  <text class="body" x="75" y="333">Experiment &amp; confounds</text>
  <text class="body" x="75" y="359">Budget, pivot &amp; stopping</text>
  <rect class="row" x="55" y="402" rx="10" width="225" height="112"/>
  <text class="axis" x="75" y="430">INFERENCE</text>
  <text class="body" x="75" y="459">Evidence &amp; contradiction</text>
  <text class="body" x="75" y="485">Claims &amp; review response</text>
  <text class="small" x="55" y="558">120 INDEPENDENT PAIRS · ≥3 DOMAINS</text>
  <text class="small" x="55" y="580">AXES POWERED · ALL SIX TAGS REPORTED</text>

  <path class="arrow" d="M300 336 H345"/>
  <rect class="source" filter="url(#shadow)" x="345" y="130" rx="14" width="310" height="415"/>
  <text class="head" x="370" y="166">Can a source teach taste?</text>
  <text class="small" x="370" y="194">SAME SOURCE BYTES</text>
  <text class="body" x="370" y="226">Raw evidence</text>
  <text class="body" x="370" y="250">vs grounded decision principle</text>
  <text class="body" x="370" y="274">vs prestige-only / low-quality source</text>
  <line x1="370" y1="298" x2="630" y2="298" stroke="#b9c7da"/>
  <text class="small" x="370" y="328">CHECKS</text>
  <text class="body" x="370" y="358">decision and evidence fidelity</text>
  <text class="body" x="370" y="382">explicit applicability boundaries</text>
  <text class="body" x="370" y="406">counterfactual reversal condition</text>
  <text class="body" x="370" y="430">compression at equal information</text>
  <text class="small" x="370" y="478">INSIGHT</text>
  <text class="body" x="370" y="506">Quality is learned from content,</text>
  <text class="body" x="370" y="528">not venue or author identity.</text>

  <path class="arrow" d="M655 336 H700"/>
  <rect class="decision" filter="url(#shadow)" x="700" y="130" rx="14" width="340" height="415"/>
  <text class="head" x="725" y="166">Does taste transfer selectively?</text>
  <text class="small" x="725" y="194">SAME MODEL · ACTIONS · TOKEN BUDGET</text>
  <text class="body" x="725" y="226">Base · decision state only</text>
  <text class="body" x="725" y="250">Raw · equal-token source evidence</text>
  <text class="body" x="725" y="274">Matched · applicable Taste</text>
  <text class="body" x="725" y="298">Mismatched · high-quality but inapplicable</text>
  <line x1="725" y1="322" x2="1015" y2="322" stroke="#b8d4c7"/>
  <text class="small" x="725" y="352">PRIMARY SIGNATURE</text>
  <text class="body" x="725" y="382">matched &gt; raw &gt; base</text>
  <text class="body" x="725" y="406">matched &gt; mismatched</text>
  <text class="body" x="725" y="430">correct abstention when none transfers</text>
  <text class="body" x="725" y="454">boundary fact flips the chosen action</text>
  <text class="small" x="725" y="494">METRICS</text>
  <text class="body" x="725" y="520">regret · specificity · selective risk</text>

  <path class="arrow" d="M1040 336 H1085"/>
  <rect class="learning" filter="url(#shadow)" x="1085" y="130" rx="14" width="360" height="415"/>
  <text class="head" x="1110" y="166">Does feedback improve later taste?</text>
  <text class="small" x="1110" y="194">SOURCE-DISJOINT NEXT DECISIONS</text>
  <text class="body" x="1110" y="226">No update</text>
  <text class="body" x="1110" y="250">Reviewed delayed-credit update</text>
  <text class="body" x="1110" y="274">Shuffled-credit negative control</text>
  <line x1="1110" y1="298" x2="1420" y2="298" stroke="#e1c693"/>
  <text class="small" x="1110" y="328">CAUSAL REQUIREMENT</text>
  <text class="body" x="1110" y="358">update beats both controls</text>
  <text class="body" x="1110" y="382">policy changes an eligible action</text>
  <text class="body" x="1110" y="406">changed action reaches execution</text>
  <text class="body" x="1110" y="430">later outcome supplies the credit</text>
  <text class="small" x="1110" y="478">FAILURE THAT TEACHES US</text>
  <text class="body" x="1110" y="506">Generic “good advice” that cannot tell</text>
  <text class="body" x="1110" y="528">when it does not apply is not Taste.</text>

  <rect class="external" filter="url(#shadow)" x="55" y="620" rx="16" width="935" height="170"/>
  <text class="head" x="80" y="656">External validity — separate from SciTasteBench</text>
  <text class="body" x="80" y="690">MLRC-Bench: objective training-task progress and progress per GPU/API budget</text>
  <text class="body" x="80" y="720">MLR-Bench: idea-to-paper package quality under blinded, evidence-aware review</text>
  <text class="body" x="80" y="750">EXP-Bench: hypothesis → implementation → execution → conclusion integrity, when runtime assets qualify</text>
  <text class="small" x="80" y="776">FULL vs NATIVE BASE · RAW/RAG · OFFICIAL MLAB / MLR-AGENT · SAME MODEL AND BUDGET</text>

  <path class="arrow" d="M990 705 H1040"/>
  <rect class="gate" filter="url(#shadow)" x="1040" y="620" rx="16" width="405" height="170"/>
  <text class="head" x="1065" y="656">Paper claim is admitted only if</text>
  <text class="body" x="1065" y="690">the abstraction preserves useful structure,</text>
  <text class="body" x="1065" y="716">transfer is specific rather than generic context,</text>
  <text class="body" x="1065" y="742">and changed decisions improve external outcomes.</text>
  <text class="small" x="1065" y="776">NO OMNIBUS “SCITASTE SCORE”</text>
</svg>
