[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scitaste"
version = "0.1.0"
description = "Taste-guided, decision-centric autonomous research control"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SciTaste contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
local-gpu = [
  "accelerate>=1.1,<2",
  "safetensors>=0.4,<1",
  "torch>=2.5,<2.6",
  "transformers>=4.57,<4.58",
]
study = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
]
[project.scripts]
scitaste = "scitaste.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scitaste"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scitaste"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
